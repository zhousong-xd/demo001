<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>宴席灰盒 · Banquet Pilot（离线单文件）</title>
  <style>
:root {
  --bg: #1b1e24;
  --panel: #252a33;
  --seat: #3a4250;
  --seat-hl: #5a6a88;
  --text: #e8eaed;
  --muted: #9aa3b2;
  --accent: #6cb6ff;
  --win: #3dd68c;
  --danger: #f07178;
  --pending: #c9a227;
  --ok: #3dd68c;
  --bad: #f07178;
  --waiting: #2c3340;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  font-family: "Segoe UI", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--bg); color: var(--text);
  overflow-x: hidden;
  touch-action: manipulation;
  user-select: none;
}
#app {
  min-height: 100%;
  max-width: 480px;
  margin: 0 auto;
  padding: 8px 10px calc(12px + var(--safe-bottom));
  display: flex;
  flex-direction: column;
  gap: 8px;
}
header.bar {
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
}
header.bar h1 {
  font-size: 15px; margin: 0; flex: 1 1 auto; font-weight: 600;
}
.btn {
  border: 1px solid #4a5568; background: var(--panel); color: var(--text);
  border-radius: 8px; padding: 8px 10px; font-size: 13px; min-height: 36px;
  cursor: pointer;
}
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.primary { border-color: var(--accent); color: var(--accent); }
.btn.active { background: #334155; border-color: var(--accent); }
.level-switch { display: flex; gap: 4px; }
.status-line {
  font-size: 12px; color: var(--muted); min-height: 1.2em;
}
.status-line.win { color: var(--win); font-weight: 600; }
.status-line.err { color: var(--danger); }

.table-wrap {
  background: var(--panel);
  border-radius: 12px;
  padding: 10px;
  position: relative;
}
.table-grid {
  display: grid;
  gap: 8px;
  justify-content: center;
}
.table-grid.layout-4 {
  grid-template-columns: repeat(2, minmax(64px, 1fr));
  grid-template-areas:
    "A1 A2"
    "B1 B2";
}
.table-grid.layout-6 {
  grid-template-columns: repeat(3, minmax(56px, 1fr));
  grid-template-areas:
    "A1 A2 A3"
    "B1 B2 B3";
}
.seat {
  grid-area: var(--seat-area);
  aspect-ratio: 1;
  min-height: 56px;
  background: var(--seat);
  border-radius: 10px;
  border: 2px solid transparent;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  position: relative;
  font-size: 11px; color: var(--muted);
}
.seat.hl { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(108,182,255,.25); }
.seat.drop-target { border-color: var(--ok); }
.seat .seat-id { position: absolute; top: 3px; left: 5px; font-size: 10px; opacity: .7; }

.waiting {
  background: var(--waiting);
  border-radius: 12px;
  padding: 8px;
  min-height: 72px;
}
.waiting h2 { margin: 0 0 6px; font-size: 12px; color: var(--muted); font-weight: 500; }
.waiting-row {
  display: flex; flex-wrap: wrap; gap: 8px; min-height: 52px; align-items: center;
}

.char {
  width: 48px; height: 48px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 700; color: #111;
  border: 2px solid rgba(255,255,255,.35);
  cursor: grab; touch-action: none;
  position: relative;
  z-index: 2;
}
.char.selected { outline: 3px solid var(--accent); outline-offset: 2px; }
.char.hl { box-shadow: 0 0 0 3px rgba(108,182,255,.55); }
.char.dragging { opacity: 0.35; }
.char .badge {
  position: absolute; bottom: -2px; right: -2px;
  font-size: 9px; background: #111; color: #fff;
  border-radius: 4px; padding: 0 3px; line-height: 1.2;
}

.ghost {
  position: fixed; pointer-events: none; z-index: 1000;
  width: 48px; height: 48px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 700; color: #111;
  border: 2px solid #fff; opacity: 0.9;
  transform: translate(-50%, -50%);
}

.rules {
  background: var(--panel);
  border-radius: 12px;
  padding: 8px;
  flex: 1;
  overflow: auto;
  max-height: 40vh;
}
.rules h2 { margin: 0 0 6px; font-size: 12px; color: var(--muted); font-weight: 500; }
.rule {
  display: grid;
  grid-template-columns: 28px 1fr;
  gap: 4px 8px;
  padding: 6px 6px;
  border-radius: 8px;
  font-size: 12px;
  border: 1px solid transparent;
  cursor: pointer;
}
.rule + .rule { margin-top: 4px; }
.rule .sym { font-size: 14px; text-align: center; font-weight: 700; }
.rule .meta { color: var(--muted); font-size: 10px; }
.rule.st-pending { background: rgba(201,162,39,.12); }
.rule.st-pending .sym { color: var(--pending); }
.rule.st-satisfied { background: rgba(61,214,140,.12); }
.rule.st-satisfied .sym { color: var(--ok); }
.rule.st-conflict { background: rgba(240,113,120,.12); }
.rule.st-conflict .sym { color: var(--bad); }
.rule.active { border-color: var(--accent); }

.hint {
  font-size: 11px; color: var(--muted); line-height: 1.35;
}

.tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.storage-msg {
  font-size: 12px; color: #1b1e24; background: #f0c14b; border-radius: 8px;
  padding: 8px 10px; cursor: pointer; line-height: 1.35;
}
.hints-box {
  background: var(--panel); border-radius: 10px; padding: 8px 10px;
  font-size: 12px; color: var(--text); line-height: 1.4;
}
.hint-line + .hint-line { margin-top: 6px; color: var(--muted); }
.feast {
  background: rgba(61,214,140,.15); border: 1px solid var(--win);
  border-radius: 12px; padding: 10px; text-align: center;
}
.feast-title { font-weight: 700; color: var(--win); margin-bottom: 8px; }
.feast-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.char.calm { box-shadow: 0 0 0 2px rgba(61,214,140,.65); }

  </style>

  <script type="module">

/* ==== src/core/geometry.js ==== */
/** Seat geometry for Banquet Pilot (browser-reusable ESM).
 *
 * Rows A (top) and B (bottom); column index increases left → right.
 * - adjacent: same row and |index| == 1 (never across the table; never diagonal)
 * - faces: different row and same column index
 * - end: leftmost or rightmost *available* seat in that row for the level
 */

/**
 * @param {string} seat
 * @returns {[string, number]}
 */
function parseSeat(seat) {
  if (
    typeof seat !== "string" ||
    seat.length < 2 ||
    (seat[0] !== "A" && seat[0] !== "B") ||
    !/^\d+$/.test(seat.slice(1))
  ) {
    throw new Error(`illegal seat id: ${JSON.stringify(seat)}`);
  }
  return [seat[0], Number(seat.slice(1))];
}

/**
 * @param {string} layout
 * @returns {string[]}
 */
function seatsForLayout(layout) {
  const key = String(layout).toLowerCase();
  if (key === "4" || key === "l01" || key === "four") {
    return ["A1", "A2", "B1", "B2"];
  }
  if (key === "6" || key === "l02" || key === "l03" || key === "six") {
    return ["A1", "A2", "A3", "B1", "B2", "B3"];
  }
  throw new Error(`unknown layout: ${JSON.stringify(layout)}`);
}

/**
 * @param {string} a
 * @param {string} b
 */
function adjacent(a, b) {
  const [ra, ia] = parseSeat(a);
  const [rb, ib] = parseSeat(b);
  return ra === rb && Math.abs(ia - ib) === 1;
}

/**
 * @param {string} a
 * @param {string} b
 */
function faces(a, b) {
  const [ra, ia] = parseSeat(a);
  const [rb, ib] = parseSeat(b);
  return ra !== rb && ia === ib;
}

/**
 * @param {string} seat
 * @param {string[]} available
 */
function isEnd(seat, available) {
  if (!available.includes(seat)) return false;
  const [row] = parseSeat(seat);
  const rowSeats = available
    .filter((s) => parseSeat(s)[0] === row)
    .slice()
    .sort((x, y) => parseSeat(x)[1] - parseSeat(y)[1]);
  if (rowSeats.length === 0) return false;
  return seat === rowSeats[0] || seat === rowSeats[rowSeats.length - 1];
}



/* ==== src/core/rules.js ==== */
/** Rule evaluation: PENDING / SATISFIED / CONFLICT + level/calm validation.
 *
 * Public evaluation entry: evaluateLevel / isWin / validatePlayable.
 * evaluateRule is low-level and assumes already-validated inputs —
 * UI must not bypass evaluateLevel.
 */



const PENDING = "PENDING";
const SATISFIED = "SATISFIED";
const CONFLICT = "CONFLICT";

const KNOWN_KINDS = new Set([
  "at",
  "not_beside",
  "faces",
  "end",
  "same_row",
  "not_faces_unless",
]);

/** Kinds that require `other`. */
const NEEDS_OTHER = new Set(["not_beside", "faces", "same_row", "not_faces_unless"]);

/**
 * @param {Record<string, string|null|undefined>} assignment
 * @param {string} charId
 * @returns {string|null}
 */
function seated(assignment, charId) {
  const seat = assignment[charId];
  if (seat === null || seat === undefined || seat === "") return null;
  return seat;
}

/**
 * Low-level rule evaluator. Assumes inputs already passed validatePlayable /
 * validateLevel. UI must not call this to bypass the public evaluateLevel path.
 *
 * @param {object} rule
 * @param {Record<string, string|null|undefined>} assignment
 * @param {{ availableSeats: string[], calm?: Iterable<string> }} opts
 */
function evaluateRule(rule, assignment, { availableSeats, calm = [] } = {}) {
  const calmSet = calm instanceof Set ? calm : new Set(calm);
  const kind = rule.kind;
  const subject = rule.subject;

  if (kind === "at") {
    const seat = seated(assignment, subject);
    if (seat === null) return PENDING;
    return seat === rule.seat ? SATISFIED : CONFLICT;
  }

  if (kind === "not_beside") {
    const other = rule.other;
    const a = seated(assignment, subject);
    const b = seated(assignment, other);
    if (a === null || b === null) return PENDING;
    return adjacent(a, b) ? CONFLICT : SATISFIED;
  }

  if (kind === "faces") {
    const other = rule.other;
    const a = seated(assignment, subject);
    const b = seated(assignment, other);
    if (a === null || b === null) return PENDING;
    return faces(a, b) ? SATISFIED : CONFLICT;
  }

  if (kind === "end") {
    const seat = seated(assignment, subject);
    if (seat === null) return PENDING;
    return isEnd(seat, availableSeats) ? SATISFIED : CONFLICT;
  }

  if (kind === "same_row") {
    const other = rule.other;
    const a = seated(assignment, subject);
    const b = seated(assignment, other);
    if (a === null || b === null) return PENDING;
    return parseSeat(a)[0] === parseSeat(b)[0] ? SATISFIED : CONFLICT;
  }

  if (kind === "not_faces_unless") {
    const other = rule.other;
    const required = rule.unless_state ?? "calm";
    const a = seated(assignment, subject);
    const b = seated(assignment, other);
    if (a === null || b === null) return PENDING;
    if (required === "calm" && calmSet.has(subject)) return SATISFIED;
    if (faces(a, b)) return CONFLICT;
    return SATISFIED;
  }

  throw new Error(`unknown rule kind: ${JSON.stringify(kind)}`);
}

/**
 * @param {Record<string, string|null|undefined>} assignment
 * @param {{ characters: string[], availableSeats: string[], calm?: Iterable<string> }} opts
 * @returns {string[]}
 */
function validateAssignment(
  assignment,
  { characters, availableSeats, calm = [] } = {},
) {
  const errors = [];
  const calmSet = calm instanceof Set ? calm : new Set(calm);
  const charSet = new Set(characters);
  const seatSet = new Set(availableSeats);

  for (const cid of Object.keys(assignment)) {
    if (!charSet.has(cid)) errors.push(`illegal character id: ${cid}`);
  }

  /** @type {Record<string, string>} */
  const occupied = {};
  for (const [cid, seat] of Object.entries(assignment)) {
    if (seat === null || seat === undefined || seat === "") continue;
    try {
      parseSeat(seat);
    } catch (e) {
      errors.push(e instanceof Error ? e.message : String(e));
      continue;
    }
    if (!seatSet.has(seat)) {
      errors.push(`seat ${seat} not available in this level`);
      continue;
    }
    if (Object.prototype.hasOwnProperty.call(occupied, seat)) {
      errors.push(`duplicate seat ${seat}: ${occupied[seat]} and ${cid}`);
    } else {
      occupied[seat] = cid;
    }
  }

  for (const cid of calmSet) {
    if (!charSet.has(cid)) errors.push(`calm on unknown character: ${cid}`);
  }

  return errors;
}

/**
 * True iff stock is a finite non-negative integer (no Number() coercion of strings).
 * @param {unknown} stock
 */
function isValidStock(stock) {
  return (
    typeof stock === "number" &&
    Number.isFinite(stock) &&
    Number.isInteger(stock) &&
    stock >= 0
  );
}

/**
 * Effective calm = explicit calm ∪ initial_calm, with prop/stock/target checks.
 * Does not Number()-coerce bad stock; invalid stock pushes an error and is
 * excluded from the calm-stock sum.
 * @param {object} level
 * @param {Iterable<string>|null|undefined} calm
 * @returns {{ effective: Set<string>, errors: string[] }}
 */
function resolveEffectiveCalm(level, calm = null) {
  const errors = [];
  const characters = level.characters || [];
  const charSet = new Set(characters);
  const props = Array.isArray(level.props) ? level.props : [];
  const initial = level.initial_calm || [];
  const explicit = calm == null ? [] : calm;
  const effective = new Set([...initial, ...explicit]);

  for (const cid of effective) {
    if (!charSet.has(cid)) {
      errors.push(`calm on unknown character: ${cid}`);
    }
  }

  if (props.length === 0) {
    if (effective.size > 0) {
      errors.push("calm illegal: level has no props that can grant calm");
    }
    return { effective, errors };
  }

  /** @type {Set<string>} */
  const validTargets = new Set();
  let calmStock = 0;
  for (const prop of props) {
    const targets = prop.valid_targets || [];
    for (const t of targets) validTargets.add(t);
    if (targets.length > 0) {
      if (!isValidStock(prop.stock)) {
        errors.push(
          `prop ${prop.id ?? "(missing id)"} stock must be a finite non-negative integer, got ${JSON.stringify(prop.stock)}`,
        );
      } else {
        calmStock += prop.stock;
      }
    }
  }

  for (const cid of effective) {
    if (charSet.has(cid) && !validTargets.has(cid)) {
      errors.push(`calm target not in any prop.valid_targets: ${cid}`);
    }
  }

  if (effective.size > calmStock) {
    errors.push(
      `calm effects ${effective.size} exceed available calm stock ${calmStock}`,
    );
  }

  return { effective, errors };
}

/**
 * Structural validation of a level definition.
 * @param {object} level
 * @returns {string[]}
 */
function validateLevel(level) {
  const errors = [];
  const characters = level.characters || [];
  const available = level.seats || seatsForLayout(level.layout);
  const rules = level.rules || [];
  const props = Array.isArray(level.props) ? level.props : [];
  const initial = level.initial_calm || [];

  const seenChars = new Set();
  for (const c of characters) {
    if (seenChars.has(c)) errors.push(`duplicate character id: ${c}`);
    else seenChars.add(c);
  }

  const seenSeats = new Set();
  for (const s of available) {
    if (seenSeats.has(s)) errors.push(`duplicate seat id: ${s}`);
    else {
      try {
        parseSeat(s);
        seenSeats.add(s);
      } catch (e) {
        errors.push(e instanceof Error ? e.message : String(e));
      }
    }
  }

  const seenRuleIds = new Set();
  for (const rule of rules) {
    const rid = rule.id;
    if (rid == null || rid === "") {
      errors.push("rule missing required field: id");
    } else if (seenRuleIds.has(rid)) {
      errors.push(`duplicate rule id: ${rid}`);
    } else {
      seenRuleIds.add(rid);
    }

    if (rule.kind == null || rule.kind === "") {
      errors.push(`rule ${rid ?? "(no id)"} missing required field: kind`);
    } else if (!KNOWN_KINDS.has(rule.kind)) {
      errors.push(`unknown rule kind: ${JSON.stringify(rule.kind)}`);
    }

    if (rule.subject == null || rule.subject === "") {
      errors.push(`rule ${rid ?? "(no id)"} missing required field: subject`);
    } else if (!seenChars.has(rule.subject)) {
      errors.push(`rule subject not in characters: ${rule.subject}`);
    }

    if (rule.kind === "at") {
      if (rule.seat == null || rule.seat === "") {
        errors.push(`rule ${rid ?? "(no id)"} kind at missing required field: seat`);
      } else if (!seenSeats.has(rule.seat)) {
        errors.push(`rule seat not available: ${rule.seat}`);
      }
    }

    if (NEEDS_OTHER.has(rule.kind)) {
      if (rule.other == null || rule.other === "") {
        errors.push(
          `rule ${rid ?? "(no id)"} kind ${rule.kind} missing required field: other`,
        );
      } else if (!seenChars.has(rule.other)) {
        errors.push(`rule other not in characters: ${rule.other}`);
      }
    }

    // not_faces_unless: missing unless_state OK (default calm);
    // explicit null/''/unknown REJECT; only 'calm' allowed when present.
    if (rule.kind === "not_faces_unless" && Object.prototype.hasOwnProperty.call(rule, "unless_state")) {
      if (rule.unless_state !== "calm") {
        errors.push(
          `rule ${rid ?? "(no id)"} unless_state must be 'calm' when present, got ${JSON.stringify(rule.unless_state)}`,
        );
      }
    }
  }

  const seenPropIds = new Set();
  for (const prop of props) {
    const pid = prop.id;
    if (pid == null || pid === "") {
      errors.push("prop missing required field: id");
    } else if (seenPropIds.has(pid)) {
      errors.push(`duplicate prop id: ${pid}`);
    } else {
      seenPropIds.add(pid);
    }

    if (!isValidStock(prop.stock)) {
      errors.push(
        `prop ${pid ?? "(missing id)"} stock must be a finite non-negative integer, got ${JSON.stringify(prop.stock)}`,
      );
    }

    const targets = prop.valid_targets || [];
    for (const t of targets) {
      if (!seenChars.has(t)) {
        errors.push(`prop ${pid ?? "(missing id)"} valid_targets includes unknown character: ${t}`);
      }
    }
  }

  for (const cid of initial) {
    if (!seenChars.has(cid)) {
      errors.push(`initial_calm unknown character: ${cid}`);
    }
  }

  // calm grantability (stock/targets/no-props) via resolveEffectiveCalm
  const { errors: calmErrs } = resolveEffectiveCalm(level, null);
  for (const e of calmErrs) {
    // avoid duplicating stock errors already reported above
    if (e.includes("stock must be a finite")) continue;
    errors.push(e);
  }

  return errors;
}

/**
 * Unified playable-state validation entry.
 * 1) validateLevel — stop on config errors
 * 2) resolveEffectiveCalm — collect errors
 * 3) validateAssignment with effectiveCalm
 * @param {object} level
 * @param {Record<string, string|null|undefined>} assignment
 * @param {{ calm?: Iterable<string>|null }} opts
 * @returns {{ ok: boolean, errors: string[], effectiveCalm: Set<string> }}
 */
function validatePlayable(level, assignment, { calm = null } = {}) {
  const levelErrors = validateLevel(level);
  if (levelErrors.length > 0) {
    return { ok: false, errors: levelErrors, effectiveCalm: new Set() };
  }

  const available = level.seats || seatsForLayout(level.layout);
  const { effective, errors: calmErrors } = resolveEffectiveCalm(level, calm);
  const errors = [...calmErrors];

  const asgErrors = validateAssignment(assignment, {
    characters: level.characters,
    availableSeats: available,
    calm: effective,
  });
  for (const e of asgErrors) errors.push(e);

  return {
    ok: errors.length === 0,
    errors,
    effectiveCalm: effective,
  };
}

/**
 * Evaluate every rule. ALWAYS returns structured result:
 *   legal:   { ok:true,  errors:[], rules:[{id,status}, ...] }
 *   illegal: { ok:false, errors:[...], rules:[] }
 * Never returns SATISFIED for illegal configs.
 *
 * @param {object} level
 * @param {Record<string, string|null|undefined>} assignment
 * @param {{ calm?: Iterable<string>|null }} opts
 * @returns {{ ok: boolean, errors: string[], rules: {id:string,status:string}[] }}
 */
function evaluateLevel(level, assignment, { calm = null } = {}) {
  const playable = validatePlayable(level, assignment, { calm });
  if (!playable.ok) {
    return { ok: false, errors: playable.errors, rules: [] };
  }

  const available = level.seats || seatsForLayout(level.layout);
  const results = [];
  for (const rule of level.rules) {
    results.push({
      id: rule.id,
      status: evaluateRule(rule, assignment, {
        availableSeats: available,
        calm: playable.effectiveCalm,
      }),
    });
  }
  return { ok: true, errors: [], rules: results };
}

/**
 * Win iff evaluateLevel ok, every character seated, and all rules SATISFIED.
 * Reuses the same validation path as evaluateLevel (no second checker).
 *
 * @param {object} level
 * @param {Record<string, string|null|undefined>} assignment
 * @param {{ calm?: Iterable<string>|null }} opts
 */
function isWin(level, assignment, { calm = null } = {}) {
  const result = evaluateLevel(level, assignment, { calm });
  if (!result.ok) return false;

  const characters = level.characters;
  for (const c of characters) {
    if (seated(assignment, c) === null) return false;
  }

  return result.rules.every((r) => r.status === SATISFIED);
}



/* ==== src/core/solver.js ==== */
/** Static full-seat enumerator (no UI). */




/**
 * @param {string[]} arr
 * @returns {Generator<string[]>}
 */
function* permutations(arr) {
  const a = arr.slice();
  const n = a.length;
  if (n === 0) {
    yield [];
    return;
  }
  const c = new Array(n).fill(0);
  yield a.slice();
  let i = 0;
  while (i < n) {
    if (c[i] < i) {
      const k = i % 2 === 0 ? 0 : c[i];
      const tmp = a[k];
      a[k] = a[i];
      a[i] = tmp;
      yield a.slice();
      c[i] += 1;
      i = 0;
    } else {
      c[i] = 0;
      i += 1;
    }
  }
}

/**
 * @param {string[]} characters
 * @param {string[]} seats
 * @returns {Generator<Record<string, string>>}
 */
function* fullAssignments(characters, seats) {
  if (characters.length !== seats.length) {
    throw new Error(
      `enumerator requires |characters|==|seats|, got ${characters.length} vs ${seats.length}`,
    );
  }
  for (const perm of permutations(seats)) {
    /** @type {Record<string, string>} */
    const asg = {};
    for (let i = 0; i < characters.length; i++) asg[characters[i]] = perm[i];
    yield asg;
  }
}

/**
 * @param {object} level
 * @param {{ calm?: Iterable<string>|null }} opts
 */
function enumerateSolutions(level, { calm = null } = {}) {
  const characters = level.characters;
  const seats = level.seats || seatsForLayout(level.layout);
  /** @type {Record<string, string>[]} */
  const solutions = [];
  for (const asg of fullAssignments(characters, seats)) {
    if (isWin(level, asg, { calm })) solutions.push(asg);
  }
  return solutions;
}

/**
 * @param {object} level
 * @param {{ calm?: Iterable<string>|null }} opts
 * @returns {[number, number]}
 */
function countSolutions(level, { calm = null } = {}) {
  const characters = level.characters;
  const seats = level.seats || seatsForLayout(level.layout);
  let n = 0;
  let total = 0;
  for (const asg of fullAssignments(characters, seats)) {
    total += 1;
    if (isWin(level, asg, { calm })) n += 1;
  }
  return [n, total];
}

/** Pure board / game state for Banquet Pilot graybox (T-003/T-004).
 * No DOM. Assignment: charId -> seatId | null (null = waiting).
 * T-004: calm Set + prop inventory + full snapshots for undo.
 */

/**
 * @param {object} level
 * @returns {Record<string, string|null>}
 */
function createInitialAssignment(level) {
  /** @type {Record<string, string|null>} */
  const asg = {};
  for (const c of level.characters) asg[c] = null;
  return asg;
}

/**
 * Initial prop stocks from level definition (cannot farm via restart).
 * @param {object} level
 * @returns {Record<string, number>}
 */
function createInitialInventory(level) {
  /** @type {Record<string, number>} */
  const inv = {};
  for (const p of level.props || []) {
    if (p && typeof p.id === "string") {
      inv[p.id] = typeof p.stock === "number" ? p.stock : 0;
    }
  }
  return inv;
}

/**
 * @param {Record<string, string|null>} assignment
 * @returns {Record<string, string|null>}
 */
function cloneAssignment(assignment) {
  return { ...assignment };
}

/**
 * @param {Iterable<string>} calm
 * @returns {Set<string>}
 */
function cloneCalm(calm) {
  return new Set(calm);
}

/**
 * @param {Record<string, number>} inventory
 * @returns {Record<string, number>}
 */
function cloneInventory(inventory) {
  return { ...inventory };
}

/**
 * Full undoable snapshot (assignment + calm + inventory).
 * @param {{ assignment: Record<string, string|null>, calm: Iterable<string>, inventory: Record<string, number> }} state
 */
function snapshotPlay(state) {
  return {
    assignment: cloneAssignment(state.assignment),
    calm: [...state.calm],
    inventory: cloneInventory(state.inventory),
  };
}

/**
 * @param {{ assignment: Record<string, string|null>, calm: string[], inventory: Record<string, number> }} snap
 */
function restorePlay(snap) {
  return {
    assignment: cloneAssignment(snap.assignment),
    calm: new Set(snap.calm || []),
    inventory: cloneInventory(snap.inventory || {}),
  };
}

/**
 * Who sits on seat, or null.
 * @param {Record<string, string|null>} assignment
 * @param {string} seat
 */
function occupantOf(assignment, seat) {
  for (const [charId, s] of Object.entries(assignment)) {
    if (s === seat) return charId;
  }
  return null;
}

/**
 * Apply place/move/swap/displace. Returns null if no-op (same seat / invalid).
 * Never mutates input. Calm is character-scoped and follows moves automatically.
 *
 * @param {Record<string, string|null>} assignment
 * @param {string} charId
 * @param {string} seat
 * @param {string[]} availableSeats
 * @returns {{ next: Record<string, string|null>, kind: 'move'|'swap'|'displace' } | null}
 */
function applySeatAction(assignment, charId, seat, availableSeats) {
  if (!Object.prototype.hasOwnProperty.call(assignment, charId)) return null;
  if (!availableSeats.includes(seat)) return null;

  const from = assignment[charId] ?? null;
  if (from === seat) return null; // same-seat click / drop

  const other = occupantOf(assignment, seat);
  const next = cloneAssignment(assignment);

  if (other === null) {
    next[charId] = seat;
    return { next, kind: "move" };
  }

  if (other === charId) return null;

  if (from !== null) {
    // atomic swap of two seated characters
    next[charId] = seat;
    next[other] = from;
    return { next, kind: "swap" };
  }

  // waiting guest onto occupied seat → displace occupant to waiting
  next[charId] = seat;
  next[other] = null;
  return { next, kind: "displace" };
}

/**
 * Apply a prop that grants calm (e.g. calm_bell).
 * - Invalid target → no consume
 * - Already calm on valid target → no extra consume (idempotent)
 * - Fresh valid target with stock → consume 1, add to calm
 * Never mutates input when returning a next state; caller pushes history.
 *
 * @param {{ assignment: Record<string, string|null>, calm: Set<string>, inventory: Record<string, number> }} state
 * @param {string} propId
 * @param {string} targetChar
 * @param {object} level
 * @returns {{
 *   ok: boolean,
 *   consumed: boolean,
 *   reason: string,
 *   next: { assignment: Record<string, string|null>, calm: Set<string>, inventory: Record<string, number> } | null
 * }}
 */
function applyCalmProp(state, propId, targetChar, level) {
  const props = Array.isArray(level.props) ? level.props : [];
  const prop = props.find((p) => p && p.id === propId);
  if (!prop) {
    return { ok: false, consumed: false, reason: "no-prop", next: null };
  }
  if (!Object.prototype.hasOwnProperty.call(state.assignment, targetChar)) {
    return { ok: false, consumed: false, reason: "unknown-char", next: null };
  }
  const targets = prop.valid_targets || [];
  if (!targets.includes(targetChar)) {
    return { ok: false, consumed: false, reason: "invalid-target", next: null };
  }
  if (state.calm.has(targetChar)) {
    // Repeat on already-calm: success semantics, no extra consume, no state change
    return { ok: true, consumed: false, reason: "already-calm", next: null };
  }
  const stock = state.inventory[propId] ?? 0;
  if (stock < 1) {
    return { ok: false, consumed: false, reason: "no-stock", next: null };
  }
  const next = {
    assignment: cloneAssignment(state.assignment),
    calm: cloneCalm(state.calm),
    inventory: cloneInventory(state.inventory),
  };
  next.calm.add(targetChar);
  next.inventory[propId] = stock - 1;
  return { ok: true, consumed: true, reason: "applied", next };
}

/**
 * Undo stack stores full play snapshots (T-004) OR legacy assignment-only
 * (kept for older pushHistory callers). Prefer pushPlayHistory / popPlayHistory.
 */
function createHistory() {
  return /** @type {any[]} */ ([]);
}

/**
 * @param {any[]} history
 * @param {Record<string, string|null>} assignmentBefore
 */
function pushHistory(history, assignmentBefore) {
  history.push(cloneAssignment(assignmentBefore));
}

/**
 * @param {any[]} history
 * @returns {Record<string, string|null> | null}
 */
function popHistory(history) {
  if (history.length === 0) return null;
  return history.pop() ?? null;
}

/**
 * @param {any[]} history
 * @param {{ assignment: Record<string, string|null>, calm: Iterable<string>, inventory: Record<string, number> }} stateBefore
 */
function pushPlayHistory(history, stateBefore) {
  history.push(snapshotPlay(stateBefore));
}

/**
 * @param {any[]} history
 * @returns {{ assignment: Record<string, string|null>, calm: Set<string>, inventory: Record<string, number> } | null}
 */
function popPlayHistory(history) {
  if (history.length === 0) return null;
  const snap = history.pop();
  if (!snap) return null;
  // Legacy: plain assignment object (no calm/inventory keys as arrays)
  if (
    snap.assignment === undefined &&
    snap.calm === undefined &&
    snap.inventory === undefined
  ) {
    return {
      assignment: cloneAssignment(snap),
      calm: new Set(),
      inventory: {},
    };
  }
  return restorePlay(snap);
}

/**
 * Integrity: no duplicate seats, only known chars, seats in available or null.
 * @param {Record<string, string|null>} assignment
 * @param {string[]} characters
 * @param {string[]} availableSeats
 */
function assertBoardIntegrity(assignment, characters, availableSeats) {
  const seen = new Set();
  for (const c of characters) {
    if (!Object.prototype.hasOwnProperty.call(assignment, c)) {
      throw new Error(`missing char ${c}`);
    }
    const s = assignment[c];
    if (s === null || s === undefined || s === "") continue;
    if (!availableSeats.includes(s)) throw new Error(`illegal seat ${s}`);
    if (seen.has(s)) throw new Error(`double occupy ${s}`);
    seen.add(s);
  }
  for (const k of Object.keys(assignment)) {
    if (!characters.includes(k)) throw new Error(`unknown char ${k}`);
  }
  return true;
}

/** Versioned local save / restore for Banquet Pilot (T-004). */

const SAVE_VERSION = 1;
const SAVE_KEY = "banquet-pilot-save-v1";

/**
 * @typedef {{
 *   version: number,
 *   levelId: string,
 *   assignment: Record<string, string|null>,
 *   calm: string[],
 *   inventory: Record<string, number>,
 *   history: any[],
 *   hintTier: number,
 *   clearedLevels: string[],
 *   savedAt: string,
 * }} SavePayload
 */

/**
 * @returns {{ available: boolean, reason?: string }}
 */
function probeStorage() {
  try {
    const k = "__banquet_probe__";
    window.localStorage.setItem(k, "1");
    window.localStorage.removeItem(k);
    return { available: true };
  } catch (e) {
    return {
      available: false,
      reason: e instanceof Error ? e.message : String(e),
    };
  }
}

/**
 * Structural + level-aware validation. Returns null if unusable.
 * @param {unknown} raw
 * @param {{ characters: string[], seats: string[], props?: {id:string}[] }} level
 * @returns {SavePayload | null}
 */
function validateSavePayload(raw, level) {
  if (!raw || typeof raw !== "object") return null;
  const o = /** @type {Record<string, unknown>} */ (raw);
  if (o.version !== SAVE_VERSION) return null;
  if (typeof o.levelId !== "string") return null;
  if (!o.assignment || typeof o.assignment !== "object") return null;
  if (!Array.isArray(o.calm)) return null;
  if (!o.inventory || typeof o.inventory !== "object") return null;
  if (!Array.isArray(o.history)) return null;
  if (typeof o.hintTier !== "number" || o.hintTier < 0 || o.hintTier > 3) return null;
  if (!Array.isArray(o.clearedLevels)) return null;

  const chars = level.characters || [];
  const seats = level.seats || [];
  const asg = /** @type {Record<string, unknown>} */ (o.assignment);
  for (const c of chars) {
    if (!Object.prototype.hasOwnProperty.call(asg, c)) return null;
    const s = asg[c];
    if (s !== null && s !== undefined && s !== "" && !seats.includes(/** @type {string} */ (s))) {
      return null;
    }
  }
  for (const k of Object.keys(asg)) {
    if (!chars.includes(k)) return null;
  }
  // no double occupy
  const seen = new Set();
  for (const c of chars) {
    const s = asg[c];
    if (s === null || s === undefined || s === "") continue;
    if (seen.has(s)) return null;
    seen.add(s);
  }
  for (const cid of o.calm) {
    if (typeof cid !== "string" || !chars.includes(cid)) return null;
  }
  return /** @type {SavePayload} */ (o);
}

/**
 * @param {SavePayload} payload
 * @returns {{ ok: true } | { ok: false, unavailable: boolean, message: string }}
 */
function writeSave(payload) {
  const probe = probeStorage();
  if (!probe.available) {
    return {
      ok: false,
      unavailable: true,
      message: `本地存储不可用，进度无法保存（${probe.reason || "未知原因"}）`,
    };
  }
  try {
    window.localStorage.setItem(SAVE_KEY, JSON.stringify(payload));
    return { ok: true };
  } catch (e) {
    return {
      ok: false,
      unavailable: true,
      message: `写入存档失败：${e instanceof Error ? e.message : String(e)}`,
    };
  }
}

/**
 * @returns {{ ok: true, data: unknown } | { ok: false, corrupt?: boolean, unavailable?: boolean, message: string, missing?: boolean }}
 */
function readSaveRaw() {
  const probe = probeStorage();
  if (!probe.available) {
    return {
      ok: false,
      unavailable: true,
      message: `本地存储不可用（${probe.reason || "未知原因"}）`,
    };
  }
  try {
    const text = window.localStorage.getItem(SAVE_KEY);
    if (text == null || text === "") {
      return { ok: false, missing: true, message: "无存档" };
    }
    try {
      return { ok: true, data: JSON.parse(text) };
    } catch {
      return { ok: false, corrupt: true, message: "存档损坏（JSON 无效）" };
    }
  } catch (e) {
    return {
      ok: false,
      unavailable: true,
      message: `读取存档失败：${e instanceof Error ? e.message : String(e)}`,
    };
  }
}

/**
 * Clear save key (used after corrupt recovery).
 */
function clearSave() {
  try {
    window.localStorage.removeItem(SAVE_KEY);
  } catch {
    /* ignore */
  }
}

    assignment = cloneAssignment(restore.assignment);
    calm = cloneCalm(restore.calm || []);
    inventory = cloneInventory(restore.inventory || createInitialInventory(level));
    history = Array.isArray(restore.history) ? restore.history.slice() : createHistory();
    hintTier = typeof restore.hintTier === "number" ? restore.hintTier : 0;
  } else {
    history = createHistory();
    assignment = createInitialAssignment(level);
    calm = new Set();
    inventory = createInitialInventory(level);
    hintTier = 0;
  }
  selectedChar = null;
  highlightRuleId = null;
  propMode = null;
  winLatch = false;
  showFeast = false;
  // If restored mid-win, re-evaluate feast latch without auto-advancing
  const won = isWin(level, assignment, { calm });
  if (won) {
    winLatch = true;
    showFeast = true;
  }
  render();
  persist();
  log("level", level.id, level.title);
}

function availableSeats() {
  return level.seats.slice();
}

function commitAction(charId, seat) {
  const before = snapshotPlay(playState());
  const result = applySeatAction(assignment, charId, seat, availableSeats());
  if (!result) {
    log("noop", charId, seat);
    return false;
  }
  pushPlayHistory(history, before);
  assignment = result.next;
  assertBoardIntegrity(assignment, level.characters, availableSeats());
  selectedChar = null;
  propMode = null;
  listenerStats.commits += 1;
  log("action", result.kind, charId, "->", seat);
  afterBoardChange();
  return true;
}

function afterBoardChange() {
  const { won } = evalState();
  if (won && !winLatch) {
    winLatch = true;
    showFeast = true;
    if (!clearedLevels.includes(level.id)) {
      clearedLevels = [...clearedLevels, level.id];
    }
    log("feast", level.id);
  }
  if (!won) {
    // Allow a new feast if player undoes out of win then re-wins
    winLatch = false;
    showFeast = false;
  }
  persist();
  render();
}

function undo() {
  if (gesture) {
    endGesture("undo", { commit: false });
  }
  const prev = popPlayHistory(history);
  if (!prev) return;
  assignment = prev.assignment;
  calm = prev.calm;
  inventory = prev.inventory;
  selectedChar = null;
  propMode = null;
  showFeast = false;
  winLatch = false;
  assertBoardIntegrity(assignment, level.characters, availableSeats());
  afterBoardChange();
}

function tryApplyCalm(targetChar) {
  const before = snapshotPlay(playState());
  const r = applyCalmProp(playState(), "calm_bell", targetChar, level);
  if (!r.ok) {
    log("calm-reject", r.reason, targetChar);
    storageMessage = r.reason === "invalid-target"
      ? "安心铃只能对兔使用（无效目标，未消耗）"
      : r.reason === "no-stock"
        ? "安心铃库存不足"
        : `无法使用安心铃：${r.reason}`;
    propMode = null;
    render();
    return false;
  }
  if (r.reason === "already-calm") {
    log("calm-already", targetChar);
    storageMessage = "该角色已安心（未额外消耗）";
    propMode = null;
    render();
    return true;
  }
  if (r.next) {
    pushPlayHistory(history, before);
    assignment = r.next.assignment;
    calm = r.next.calm;
    inventory = r.next.inventory;
    selectedChar = null;
    propMode = null;
    storageMessage = `已对 ${CHAR_LABEL[targetChar] || targetChar} 使用安心铃`;
    log("calm-applied", targetChar, "stock", inventory.calm_bell);
    afterBoardChange();
    return true;
  }
  return false;
}

/**
 * Idempotent gesture teardown: always remove onMove/onUp/onCancel,
 * clear ghost/capture/gesture. Never commits.
 * Safe to call when gesture is already null.
 *
 * @param {string} reason
 * @param {{ commit?: boolean, seat?: string|null, charId?: string|null }} [opts]
 */
function endGesture(reason, opts = {}) {
  const { commit = false, seat = null, charId = null } = opts;
  if (tearingDown) return;
  if (!gesture && !commit) return;

  tearingDown = true;
  const g = gesture;
  gesture = null;

  try {
    if (g) {
      if (g.onMove) {
        window.removeEventListener("pointermove", g.onMove, true);
        listenerStats.unregister += 1;
        listenerStats.activeWindow = Math.max(0, listenerStats.activeWindow - 1);
      }
      if (g.onUp) {
        window.removeEventListener("pointerup", g.onUp, true);
        listenerStats.unregister += 1;
        listenerStats.activeWindow = Math.max(0, listenerStats.activeWindow - 1);
      }
      if (g.onCancel) {
        window.removeEventListener("pointercancel", g.onCancel, true);
        listenerStats.unregister += 1;
        listenerStats.activeWindow = Math.max(0, listenerStats.activeWindow - 1);
      }
      if (g.targetEl && g.onLostCapture) {
        g.targetEl.removeEventListener("lostpointercapture", g.onLostCapture);
      }
      if (g.targetEl && g.pointerId != null) {
        try {
          if (g.targetEl.hasPointerCapture?.(g.pointerId)) {
            g.targetEl.releasePointerCapture(g.pointerId);
          }
        } catch {
          /* ignore */
        }
      }
      if (g.ghostEl && g.ghostEl.parentNode) {
        g.ghostEl.parentNode.removeChild(g.ghostEl);
      }
      const el = document.querySelector(`.char[data-char="${g.charId}"]`);
      if (el) el.classList.remove("dragging");
      document.querySelectorAll(".seat.drop-target").forEach((s) => s.classList.remove("drop-target"));
      if (!commit) {
        listenerStats.cancels += 1;
        log("gesture-cancel", reason, g.charId);
      } else {
        log("gesture-end", reason, g.charId);
      }
    }

    if (commit && charId && seat) {
      commitAction(charId, seat);
    }
  } finally {
    tearingDown = false;
  }
}

function cancelGesture(reason) {
  endGesture(reason, { commit: false });
}

function evalState() {
  const result = evaluateLevel(level, assignment, { calm });
  const won = isWin(level, assignment, { calm });
  if (!result.ok && won) {
    return { result, won: false };
  }
  if (!result.ok) {
    return { result, won: false };
  }
  return { result, won };
}

function relatedHighlight() {
  if (!highlightRuleId || !level) return { chars: [], seats: [] };
  const rule = level.rules.find((r) => r.id === highlightRuleId);
  if (!rule) return { chars: [], seats: [] };
  return ruleRelated(rule);
}

function seatStyleArea(seat) {
  return seat;
}

function makeCharEl(charId) {
  const el = document.createElement("div");
  el.className = "char";
  el.dataset.char = charId;
  el.style.background = CHAR_COLOR[charId] || "#aaa";
  el.textContent = CHAR_LABEL[charId] || charId.slice(0, 1);
  el.setAttribute("role", "button");
  el.setAttribute("aria-label", CHAR_LABEL[charId] || charId);
  if (selectedChar === charId) el.classList.add("selected");
  if (calm.has(charId)) el.classList.add("calm");
  const rel = relatedHighlight();
  if (rel.chars.includes(charId)) el.classList.add("hl");
  if (calm.has(charId)) {
    const badge = document.createElement("span");
    badge.className = "badge";
    badge.textContent = "安";
    el.appendChild(badge);
  }

  el.addEventListener("pointerdown", onCharPointerDown);
  return el;
}

function onCharPointerDown(ev) {
  if (ev.button !== undefined && ev.button !== 0) return;
  const charId = ev.currentTarget.dataset.char;

  // Prop targeting: tap character to apply calm_bell
  if (propMode === "calm_bell") {
    ev.preventDefault();
    tryApplyCalm(charId);
    return;
  }

  if (gesture && gesture.pointerId !== ev.pointerId) {
    ev.preventDefault();
    return;
  }
  if (gesture) {
    endGesture("re-down", { commit: false });
  }

  ev.preventDefault();
  const targetEl = ev.currentTarget;
  try {
    targetEl.setPointerCapture?.(ev.pointerId);
  } catch {
    /* ignore */
  }

  const onMove = (e) => {
    if (!gesture || e.pointerId !== gesture.pointerId) return;
    const dx = e.clientX - gesture.startX;
    const dy = e.clientY - gesture.startY;
    if (!gesture.moved && Math.hypot(dx, dy) >= DRAG_THRESHOLD) {
      gesture.moved = true;
      gesture.mode = "drag";
      selectedChar = null;
      const src = document.querySelector(`.char[data-char="${gesture.charId}"]`);
      if (src) src.classList.add("dragging");
      const ghost = document.createElement("div");
      ghost.className = "ghost";
      ghost.style.background = CHAR_COLOR[gesture.charId] || "#aaa";
      ghost.textContent = CHAR_LABEL[gesture.charId] || "?";
      document.body.appendChild(ghost);
      gesture.ghostEl = ghost;
    }
    if (gesture.mode === "drag" && gesture.ghostEl) {
      gesture.ghostEl.style.left = `${e.clientX}px`;
      gesture.ghostEl.style.top = `${e.clientY}px`;
      updateDropTarget(e.clientX, e.clientY);
    }
  };

  const onUp = (e) => {
    if (!gesture || e.pointerId !== gesture.pointerId) return;
    if (e.type !== "pointerup") {
      endGesture("non-up-" + e.type, { commit: false });
      return;
    }

    const g = gesture;
    const seatEl = document.elementFromPoint(e.clientX, e.clientY)?.closest?.(".seat");
    const seat = seatEl?.dataset?.seat || null;

    if (g.mode === "drag") {
      suppressClickUntil = Date.now() + 400;
      endGesture("pointerup-drag", {
        commit: !!seat,
        seat,
        charId: g.charId,
      });
      if (!seat) {
        log("invalid-drop");
        render();
      }
      return;
    }

    const tappedChar = g.charId;
    const priorSelected = selectedChar;
    endGesture("pointerup-tap", { commit: false });

    if (priorSelected && priorSelected !== tappedChar) {
      const targetSeat = assignment[tappedChar];
      if (targetSeat) {
        commitAction(priorSelected, targetSeat);
        return;
      }
      selectedChar = tappedChar;
      render();
      return;
    }

    if (priorSelected === tappedChar) {
      selectedChar = null;
      render();
      return;
    }

    selectedChar = tappedChar;
    render();
  };

  const onCancel = (e) => {
    if (!gesture || e.pointerId !== gesture.pointerId) return;
    endGesture("pointercancel", { commit: false });
    render();
  };

  const onLostCapture = (e) => {
    if (!gesture || e.pointerId !== gesture.pointerId) return;
    endGesture("lostpointercapture", { commit: false });
    render();
  };

  gesture = {
    pointerId: ev.pointerId,
    charId,
    mode: "tap",
    startX: ev.clientX,
    startY: ev.clientY,
    moved: false,
    ghostEl: null,
    targetEl,
    onMove,
    onUp,
    onCancel,
    onLostCapture,
  };

  window.addEventListener("pointermove", onMove, true);
  window.addEventListener("pointerup", onUp, true);
  window.addEventListener("pointercancel", onCancel, true);
  targetEl.addEventListener("lostpointercapture", onLostCapture);
  listenerStats.register += 3;
  listenerStats.activeWindow += 3;
}

function updateDropTarget(x, y) {
  document.querySelectorAll(".seat.drop-target").forEach((s) => s.classList.remove("drop-target"));
  const seatEl = document.elementFromPoint(x, y)?.closest?.(".seat");
  if (seatEl) seatEl.classList.add("drop-target");
}

function onSeatClick(ev) {
  if (Date.now() < suppressClickUntil) return;
  if (gesture) return;
  if (propMode) return;
  const seat = ev.currentTarget.dataset.seat;
  if (!selectedChar) return;
  commitAction(selectedChar, seat);
}

function gatedControl(fn) {
  return (ev) => {
    if (gesture) {
      ev.preventDefault();
      ev.stopPropagation();
      return;
    }
    fn(ev);
  };
}

function persist() {
  if (!level) return;
  const payload = {
    version: SAVE_VERSION,
    levelId: level.id,
    assignment: cloneAssignment(assignment),
    calm: [...calm],
    inventory: cloneInventory(inventory),
    history: history.map((h) =>
      h && h.assignment !== undefined
        ? {
            assignment: cloneAssignment(h.assignment),
            calm: Array.isArray(h.calm) ? h.calm.slice() : [...(h.calm || [])],
            inventory: cloneInventory(h.inventory || {}),
          }
        : cloneAssignment(h),
    ),
    hintTier,
    clearedLevels: clearedLevels.slice(),
    savedAt: new Date().toISOString(),
  };
  const w = writeSave(payload);
  if (!w.ok && w.unavailable) {
    storageMessage = w.message;
  }
}

async function tryRestoreOnBoot() {
  const raw = readSaveRaw();
  if (!raw.ok) {
    if (raw.unavailable) {
      storageMessage = raw.message + " — 仍可游玩，但进度不会保存。";
    } else if (raw.corrupt) {
      storageMessage = raw.message + " — 已恢复到开局。";
      clearSave();
    }
    return null;
  }
  const data = raw.data;
  if (!data || typeof data !== "object" || data.version !== SAVE_VERSION) {
    storageMessage = "存档版本不兼容 — 已恢复到开局。";
    clearSave();
    return null;
  }
  const id = String(data.levelId || "L01").toUpperCase();
  if (!LEVEL_IDS.includes(id)) {
    storageMessage = "存档关卡无效 — 已恢复到开局。";
    clearSave();
    return null;
  }
  let lvl;
  try {
    lvl = await loadLevelJson(id);
  } catch {
    storageMessage = "存档关卡加载失败 — 已恢复到开局。";
    clearSave();
    return null;
  }
  const valid = validateSavePayload(data, lvl);
  if (!valid) {
    storageMessage = "存档状态校验失败 — 已恢复到开局。";
    clearSave();
    return null;
  }
  clearedLevels = Array.isArray(valid.clearedLevels) ? valid.clearedLevels.slice() : [];
  return { levelId: id, restore: valid };
}

function revealNextHint() {
  const max = maxHintTier(level.id);
  if (hintTier >= max) return;
  hintTier += 1;
  persist();
  render();
}

function goNextLevel() {
  const idx = LEVEL_IDS.indexOf(level.id);
  const next = LEVEL_IDS[Math.min(idx + 1, LEVEL_IDS.length - 1)];
  showFeast = false;
  if (next === level.id) {
    // Last level: replay
    resetLevel(true);
    return;
  }
  switchLevel(next);
}

function render() {
  if (!level || !app) return;
  const { result, won } = evalState();
  const rel = relatedHighlight();
  const seats = availableSeats();
  const layoutClass = seats.length === 4 ? "layout-4" : "layout-6";
  const bellStock = inventory.calm_bell ?? 0;
  const hasBell = (level.props || []).some((p) => p.id === "calm_bell");

  app.innerHTML = "";

  const header = document.createElement("header");
  header.className = "bar";
  const h1 = document.createElement("h1");
  h1.textContent = `宴席灰盒 · ${level.id} ${level.title}`;
  header.appendChild(h1);

  const sw = document.createElement("div");
  sw.className = "level-switch";
  for (const id of LEVEL_IDS) {
    const b = document.createElement("button");
    b.className = "btn" + (level.id === id ? " active" : "");
    b.type = "button";
    b.textContent = id + (clearedLevels.includes(id) ? "✓" : "");
    b.addEventListener("click", gatedControl(() => switchLevel(id)));
    sw.appendChild(b);
  }
  header.appendChild(sw);

  const undoBtn = document.createElement("button");
  undoBtn.className = "btn";
  undoBtn.type = "button";
  undoBtn.textContent = "撤销";
  undoBtn.disabled = history.length === 0;
  undoBtn.addEventListener("click", gatedControl(() => undo()));
  header.appendChild(undoBtn);

  const resetBtn = document.createElement("button");
  resetBtn.className = "btn";
  resetBtn.type = "button";
  resetBtn.textContent = "重玩";
  resetBtn.title = "恢复本关初始局面与道具库存";
  resetBtn.addEventListener("click", gatedControl(() => resetLevel(true)));
  header.appendChild(resetBtn);

  app.appendChild(header);

  if (storageMessage) {
    const msg = document.createElement("div");
    msg.className = "storage-msg";
    msg.textContent = storageMessage;
    msg.addEventListener("click", () => {
      storageMessage = "";
      render();
    });
    app.appendChild(msg);
  }

  const status = document.createElement("div");
  status.className = "status-line" + (won ? " win" : !result.ok ? " err" : "");
  status.id = "status-line";
  if (!result.ok) {
    status.textContent = `局面非法：${result.errors.join("；")}`;
  } else if (won) {
    status.textContent = "开席！全部入座且规则均满足";
  } else {
    const seated = level.characters.filter((c) => assignment[c]).length;
    const invBits = hasBell ? ` · 安心铃×${bellStock}` : "";
    status.textContent = `已入座 ${seated}/${level.characters.length} · 历史 ${history.length}${invBits} · 点选或拖拽入座`;
  }
  app.appendChild(status);

  // Props + hints toolbar
  const tools = document.createElement("div");
  tools.className = "tools";

  if (hasBell) {
    const bellBtn = document.createElement("button");
    bellBtn.className = "btn" + (propMode === "calm_bell" ? " active primary" : "");
    bellBtn.type = "button";
    bellBtn.textContent = propMode === "calm_bell"
      ? `点选目标（铃×${bellStock}）`
      : `安心铃 ×${bellStock}`;
    bellBtn.disabled = bellStock < 1 && propMode !== "calm_bell";
    bellBtn.addEventListener(
      "click",
      gatedControl(() => {
        if (propMode === "calm_bell") {
          propMode = null;
        } else {
          propMode = "calm_bell";
          selectedChar = null;
          storageMessage = "请点选兔以使用安心铃（无效目标不消耗）";
        }
        render();
      }),
    );
    tools.appendChild(bellBtn);
  }

  const hintBtn = document.createElement("button");
  hintBtn.className = "btn";
  hintBtn.type = "button";
  const maxH = maxHintTier(level.id);
  hintBtn.textContent =
    hintTier >= maxH ? `提示 ${hintTier}/${maxH}` : `免费提示 ${hintTier}/${maxH}`;
  hintBtn.disabled = hintTier >= maxH;
  hintBtn.addEventListener("click", gatedControl(() => revealNextHint()));
  tools.appendChild(hintBtn);

  app.appendChild(tools);

  if (hintTier > 0) {
    const hintsBox = document.createElement("div");
    hintsBox.className = "hints-box";
    for (let t = 1; t <= hintTier; t++) {
      const line = document.createElement("div");
      line.className = "hint-line";
      line.textContent = `提示${t}：${hintText(level.id, t)}`;
      hintsBox.appendChild(line);
    }
    app.appendChild(hintsBox);
  }

  if (showFeast && won) {
    const feast = document.createElement("div");
    feast.className = "feast";
    const ft = document.createElement("div");
    ft.className = "feast-title";
    ft.textContent = level.id === "L03" ? "三关开席成功！" : `${level.id} 开席成功`;
    feast.appendChild(ft);
    const actions = document.createElement("div");
    actions.className = "feast-actions";
    const replay = document.createElement("button");
    replay.className = "btn";
    replay.type = "button";
    replay.textContent = "重玩本关";
    replay.addEventListener(
      "click",
      gatedControl(() => {
        showFeast = false;
        resetLevel(true);
      }),
    );
    actions.appendChild(replay);
    const idx = LEVEL_IDS.indexOf(level.id);
    if (idx < LEVEL_IDS.length - 1) {
      const next = document.createElement("button");
      next.className = "btn primary";
      next.type = "button";
      next.textContent = `下一关 ${LEVEL_IDS[idx + 1]}`;
      next.addEventListener("click", gatedControl(() => goNextLevel()));
      actions.appendChild(next);
    } else {
      const back = document.createElement("button");
      back.className = "btn primary";
      back.type = "button";
      back.textContent = "返回 L01";
      back.addEventListener(
        "click",
        gatedControl(() => {
          showFeast = false;
          switchLevel("L01");
        }),
      );
      actions.appendChild(back);
    }
    feast.appendChild(actions);
    app.appendChild(feast);
  }

  const tableWrap = document.createElement("div");
  tableWrap.className = "table-wrap";
  const grid = document.createElement("div");
  grid.className = `table-grid ${layoutClass}`;
  for (const seat of seats) {
    const seatEl = document.createElement("div");
    seatEl.className = "seat";
    seatEl.dataset.seat = seat;
    seatEl.style.setProperty("--seat-area", seatStyleArea(seat));
    if (rel.seats.includes(seat)) seatEl.classList.add("hl");
    if (selectedChar) seatEl.classList.add("hl");
    const sid = document.createElement("span");
    sid.className = "seat-id";
    sid.textContent = seat;
    seatEl.appendChild(sid);
    const who = occupantOf(assignment, seat);
    if (who) seatEl.appendChild(makeCharEl(who));
    seatEl.addEventListener("click", onSeatClick);
    grid.appendChild(seatEl);
  }
  tableWrap.appendChild(grid);
  app.appendChild(tableWrap);

  const waiting = document.createElement("div");
  waiting.className = "waiting";
  const wh = document.createElement("h2");
  wh.textContent = "候客区（初始全员在此）";
  waiting.appendChild(wh);
  const row = document.createElement("div");
  row.className = "waiting-row";
  row.dataset.zone = "waiting";
  for (const c of level.characters) {
    if (!assignment[c]) row.appendChild(makeCharEl(c));
  }
  waiting.appendChild(row);
  app.appendChild(waiting);

  const rulesBox = document.createElement("div");
  rulesBox.className = "rules";
  const rh = document.createElement("h2");
  rh.textContent = "规则状态（符号+文本，非仅靠颜色）";
  rulesBox.appendChild(rh);

  if (!result.ok) {
    const p = document.createElement("div");
    p.className = "hint";
    p.textContent = "评估未通过（ok=false），不显示全绿满足态。";
    rulesBox.appendChild(p);
  } else {
    for (const rr of result.rules) {
      const rule = level.rules.find((r) => r.id === rr.id);
      const meta = STATUS_META[rr.status] || STATUS_META[PENDING];
      const el = document.createElement("div");
      el.className = `rule ${meta.className}` + (highlightRuleId === rr.id ? " active" : "");
      el.dataset.rule = rr.id;
      el.innerHTML = `<div class="sym" aria-label="${meta.text}">${meta.symbol}</div>
        <div><div>${describeRule(rule || { id: rr.id, kind: "?", subject: "?" })}</div>
        <div class="meta">${rr.id} · ${meta.symbol} ${meta.text}（${rr.status}）</div></div>`;
      el.addEventListener(
        "click",
        gatedControl(() => {
          highlightRuleId = highlightRuleId === rr.id ? null : rr.id;
          render();
        }),
      );
      rulesBox.appendChild(el);
    }
  }
  app.appendChild(rulesBox);

  const hint = document.createElement("div");
  hint.className = "hint";
  hint.textContent =
    "操作：拖拽角色到座位；或先点角色再点座位。空座移动；两入座交换；候客挤占则原住回候客。安心铃：点按钮再点兔。撤销恢复座位/安心/库存。重玩恢复初始道具。提示免费无惩罚。";
  app.appendChild(hint);

  const snapshot = {
    levelId: level.id,
    assignment: cloneAssignment(assignment),
    calm: [...calm],
    inventory: cloneInventory(inventory),
    historyLen: history.length,
    selectedChar,
    propMode,
    hintTier,
    clearedLevels: clearedLevels.slice(),
    won,
    showFeast,
    evalOk: result.ok,
    rules: result.ok ? result.rules : [],
    viewport: {
      innerWidth: window.innerWidth,
      innerHeight: window.innerHeight,
      dpr: window.devicePixelRatio,
    },
  };
  Object.defineProperties(snapshot, {
    gestureActive: {
      enumerable: true,
      get() {
        return !!gesture;
      },
    },
    ghostPresent: {
      enumerable: true,
      get() {
        return !!document.querySelector(".ghost");
      },
    },
    listenerStats: {
      enumerable: true,
      get() {
        return {
          register: listenerStats.register,
          unregister: listenerStats.unregister,
          activeWindow: listenerStats.activeWindow,
          commits: listenerStats.commits,
          cancels: listenerStats.cancels,
        };
      },
    },
  });
  window.__BANQUET__ = snapshot;
}

function onVisibility() {
  if (document.hidden) cancelGesture("visibility");
}
function onBlur() {
  cancelGesture("blur");
}

async function boot() {
  document.addEventListener("visibilitychange", onVisibility);
  window.addEventListener("blur", onBlur);
  window.addEventListener("pagehide", () => cancelGesture("pagehide"));

  const probe = probeStorage();
  if (!probe.available) {
    storageMessage = `本地存储不可用（${probe.reason || "未知"}）— 仍可游玩，但进度不会保存。`;
  }

  const params = new URLSearchParams(location.search);
  const startParam = (params.get("level") || "").toUpperCase();
  const restored = await tryRestoreOnBoot();
  const bootMsg = storageMessage;

  if (startParam && LEVEL_IDS.includes(startParam)) {
    // Explicit URL level wins (fresh play of that level) — keep recovery notices
    await switchLevel(startParam);
  } else if (restored) {
    await switchLevel(restored.levelId, { restore: restored.restore });
    if (!storageMessage) storageMessage = "已从本地存档恢复";
  } else {
    await switchLevel("L01");
  }
  if (bootMsg && !storageMessage) storageMessage = bootMsg;
  if (storageMessage) render();
}

boot().catch((e) => {
  console.error(e);
  if (app) app.textContent = `启动失败：${e.message}`;
});


  </script>
</body>
</html>
