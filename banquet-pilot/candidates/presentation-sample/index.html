<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>这桌不能坐 · 表现小样 T-053</title>
<style>
:root {
  --bg: #1b1e24;
  --panel: #252a33;
  --seat: #3a4250;
  --text: #e8eaed;
  --muted: #9aa3b2;
  --accent: #6cb6ff;
  --ok: #3dd68c;
  --bad: #f07178;
  --fox: #e07a3d;
  --rabbit: #d4a0c8;
  --crane: #7eb6d9;
  --table: #2c3340;
  --wood: #4a3a2a;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%;
  background: #0f1115; color: var(--text);
  font-family: "Segoe UI", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
  user-select: none;
}
.stage-outer {
  min-height: 100%;
  display: flex; flex-direction: column; align-items: center;
  padding: 12px 8px 24px;
}
.phone {
  width: 390px; max-width: 100%;
  height: 844px; max-height: calc(100vh - 48px);
  background: var(--bg);
  border-radius: 28px;
  border: 2px solid #333;
  box-shadow: 0 12px 40px rgba(0,0,0,.45);
  overflow: hidden;
  display: flex; flex-direction: column;
  position: relative;
}
.top {
  padding: 14px 16px 6px;
  display: flex; align-items: center; justify-content: space-between;
}
.top .mark {
  font-size: 12px; color: var(--muted); letter-spacing: .04em;
}
.beat {
  font-size: 11px; color: var(--accent);
  background: rgba(108,182,255,.12);
  border-radius: 999px; padding: 4px 10px;
  min-height: 22px;
}
.table-wrap {
  flex: 1;
  display: flex; align-items: center; justify-content: center;
  padding: 8px 18px 0;
}
.table {
  width: 300px; height: 300px;
  background:
    radial-gradient(circle at 50% 45%, #3a3228 0%, var(--wood) 55%, #2a2018 100%);
  border-radius: 50%;
  border: 6px solid #5a4634;
  box-shadow: inset 0 0 40px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.35);
  position: relative;
}
.seat {
  position: absolute;
  width: 86px; height: 86px;
  margin: -43px 0 0 -43px;
  border-radius: 16px;
  background: var(--seat);
  border: 2px solid transparent;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: border-color .2s, box-shadow .2s, transform .2s;
}
.seat:focus { outline: none; }
.seat.empty { border-style: dashed; border-color: #5a6578; opacity: .85; }
.seat.empty::after {
  content: "";
  width: 28px; height: 28px; border-radius: 50%;
  border: 2px dashed #7a8699;
}
.seat.hl { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(108,182,255,.25); }
.seat.friend-glow { box-shadow: 0 0 0 3px rgba(61,214,140,.35); }
.seat.rival-glow { box-shadow: 0 0 0 3px rgba(240,113,120,.4); }
.seat.s0 { left: 50%; top: 18%; }
.seat.s1 { left: 82%; top: 55%; }
.seat.s2 { left: 50%; top: 88%; }
.seat.s3 { left: 18%; top: 55%; }

.char {
  width: 72px; height: 72px;
  position: relative;
  transform-origin: 50% 70%;
}
.char svg { width: 100%; height: 100%; display: block; overflow: visible; }
.char .bubble {
  position: absolute; left: 50%; top: -6px;
  transform: translate(-50%, -100%);
  font-size: 14px; line-height: 1;
  opacity: 0; pointer-events: none;
  transition: opacity .25s;
  filter: drop-shadow(0 1px 2px rgba(0,0,0,.5));
}
.char.show-bubble .bubble { opacity: 1; }

/* performances */
.char.idle { animation: breathe 2.8s ease-in-out infinite; }
@keyframes breathe {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-2px); }
}
.char.wave { animation: wave 0.9s ease-in-out 2; }
@keyframes wave {
  0%,100% { transform: rotate(0deg); }
  30% { transform: rotate(-12deg); }
  60% { transform: rotate(10deg); }
}
.char.nod { animation: nod 0.7s ease-in-out 2; }
@keyframes nod {
  0%,100% { transform: translateY(0); }
  40% { transform: translateY(4px) scale(1, .96); }
}
.char.look-away-left { animation: lookL 1.2s ease-in-out forwards; }
.char.look-away-right { animation: lookR 1.2s ease-in-out forwards; }
@keyframes lookL {
  0% { transform: rotate(0); }
  100% { transform: rotate(-18deg) translateX(-4px); }
}
@keyframes lookR {
  0% { transform: rotate(0); }
  100% { transform: rotate(18deg) translateX(4px); }
}
.char.bristle { animation: bristle .55s ease-in-out 3; }
@keyframes bristle {
  0%,100% { transform: scale(1); filter: none; }
  50% { transform: scale(1.06); filter: saturate(1.3); }
}
.char.happy { animation: happy .8s ease-in-out 2; }
@keyframes happy {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

.dock {
  padding: 10px 14px 16px;
  background: linear-gradient(180deg, transparent, rgba(0,0,0,.25));
}
.hint {
  font-size: 12px; color: var(--muted);
  min-height: 1.4em; text-align: center; margin-bottom: 8px;
}
.tools {
  display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
}
.btn {
  border: 1px solid #4a5568; background: var(--panel); color: var(--text);
  border-radius: 10px; padding: 10px 14px; font-size: 13px; min-height: 40px;
  cursor: pointer;
}
.btn:active { transform: scale(.98); }
.btn.primary { border-color: var(--accent); color: var(--accent); }
.legend {
  margin-top: 8px; font-size: 10px; color: var(--muted); text-align: center;
  opacity: .7;
}
.outside {
  width: 390px; max-width: 100%;
  margin-top: 14px; font-size: 12px; color: #a39a8c; line-height: 1.5;
}
.outside a { color: #c9b8a0; }
</style>
</head>
<body>
<div class="stage-outer">
  <div style="width:390px;max-width:100%;margin:0 0 10px;padding:8px 10px;background:#f3e0d6;border:2px solid #8b3a2a;border-radius:10px;color:#8b3a2a;font-size:12px;font-weight:650;text-align:center">
    表现候选 / 非正式 — 不是正式三关
    <div style="margin-top:4px;font-weight:500;color:#7a6a58;font-size:11px">正式主链：https://zhousong-xd.github.io/demo001/</div>
  </div>

  <div class="phone" id="phone" aria-label="表现小样 390x844">
    <div class="top">
      <span class="mark">一桌 · 小样</span>
      <span class="beat" id="beat">…</span>
    </div>
    <div class="table-wrap">
      <div class="table" id="table" role="group" aria-label="圆桌四座"></div>
    </div>
    <div class="dock">
      <div class="hint" id="hint"></div>
      <div class="tools">
        <button class="btn" type="button" id="btnReplay">再看一遍</button>
        <button class="btn primary" type="button" id="btnShuffle">换个座试试</button>
      </div>
      <div class="legend">点角色再点空位 · 好友会招手 · 仇人会别扭</div>
    </div>
  </div>
  <p class="outside">
    T-053 表现小样（候选）。说明见同目录 <code>README.md</code>。
    不改冻结 dist。— 宴席·美术
  </p>
</div>

<script>
/** 狐↔兔 仇；兔↔鹤 友；一桌四座，先三人 */
const REL = {
  fox: { rival: 'rabbit', friend: null },
  rabbit: { rival: 'fox', friend: 'crane' },
  crane: { rival: null, friend: 'rabbit' },
};
const LABEL = { fox: '狐', rabbit: '兔', crane: '鹤' };
const COLOR = { fox: '#e07a3d', rabbit: '#d4a0c8', crane: '#7eb6d9' };

/** seat index 0..3 around table */
let seats = ['fox', 'rabbit', null, 'crane']; // intentional: fox next to rabbit = awkward
let selected = null;
let perfTimer = null;
let beatTimer = null;

function svgFor(id) {
  const c = COLOR[id];
  if (id === 'fox') {
    return `<svg viewBox="0 0 72 72" aria-hidden="true">
      <circle cx="36" cy="40" r="22" fill="${c}"/>
      <polygon points="16,28 22,8 30,30" fill="${c}"/>
      <polygon points="42,30 50,8 56,28" fill="${c}"/>
      <circle cx="28" cy="38" r="3" fill="#2a1a10"/>
      <circle cx="44" cy="38" r="3" fill="#2a1a10"/>
      <ellipse cx="36" cy="48" rx="5" ry="3" fill="#5a3018"/>
      <text x="36" y="66" text-anchor="middle" font-size="11" fill="#e8eaed" font-family="sans-serif">狐</text>
    </svg>`;
  }
  if (id === 'rabbit') {
    return `<svg viewBox="0 0 72 72" aria-hidden="true">
      <ellipse cx="26" cy="18" rx="7" ry="16" fill="${c}"/>
      <ellipse cx="46" cy="18" rx="7" ry="16" fill="${c}"/>
      <circle cx="36" cy="40" r="22" fill="${c}"/>
      <circle cx="28" cy="38" r="3" fill="#2a1a20"/>
      <circle cx="44" cy="38" r="3" fill="#2a1a20"/>
      <circle cx="36" cy="48" r="2.5" fill="#6a3050"/>
      <text x="36" y="66" text-anchor="middle" font-size="11" fill="#e8eaed" font-family="sans-serif">兔</text>
    </svg>`;
  }
  return `<svg viewBox="0 0 72 72" aria-hidden="true">
    <circle cx="36" cy="42" r="20" fill="${c}"/>
    <ellipse cx="36" cy="18" rx="10" ry="14" fill="${c}"/>
    <path d="M50 22 Q66 10 62 28 Q58 36 50 30" fill="${c}"/>
    <circle cx="30" cy="40" r="2.5" fill="#1a2830"/>
    <circle cx="42" cy="40" r="2.5" fill="#1a2830"/>
    <text x="36" y="66" text-anchor="middle" font-size="11" fill="#e8eaed" font-family="sans-serif">鹤</text>
  </svg>`;
}

function neighbors(i) {
  const n = seats.length;
  return [(i + 1) % n, (i + n - 1) % n].map(j => seats[j]).filter(Boolean);
}

function render() {
  const table = document.getElementById('table');
  table.innerHTML = '';
  seats.forEach((who, i) => {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'seat s' + i + (who ? '' : ' empty');
    el.dataset.seat = String(i);
    if (selected === i) el.classList.add('hl');
    if (who) {
      const wrap = document.createElement('div');
      wrap.className = 'char idle';
      wrap.dataset.char = who;
      wrap.innerHTML = `<span class="bubble" data-bubble></span>` + svgFor(who);
      el.appendChild(wrap);
      const ns = neighbors(i);
      if (REL[who].friend && ns.includes(REL[who].friend)) el.classList.add('friend-glow');
      if (REL[who].rival && ns.includes(REL[who].rival)) el.classList.add('rival-glow');
    }
    el.addEventListener('click', () => onSeat(i));
    table.appendChild(el);
  });
}

function setBeat(t) { document.getElementById('beat').textContent = t; }
function setHint(t) { document.getElementById('hint').textContent = t; }

function clearPerfClasses() {
  document.querySelectorAll('.char').forEach(c => {
    c.classList.remove('wave','nod','look-away-left','look-away-right','bristle','happy','show-bubble');
    c.classList.add('idle');
    const b = c.querySelector('[data-bubble]');
    if (b) b.textContent = '';
  });
}

function charEl(id) {
  return document.querySelector(`.char[data-char="${id}"]`);
}

function bubble(id, emoji) {
  const el = charEl(id);
  if (!el) return;
  const b = el.querySelector('[data-bubble]');
  if (b) b.textContent = emoji;
  el.classList.add('show-bubble');
}

function playLoop() {
  clearTimeout(perfTimer);
  clearTimeout(beatTimer);
  clearPerfClasses();
  const foxI = seats.indexOf('fox');
  const rabI = seats.indexOf('rabbit');
  const crI = seats.indexOf('crane');
  const foxN = foxI >= 0 ? neighbors(foxI) : [];
  const rabN = rabI >= 0 ? neighbors(rabI) : [];
  const rivalsAdjacent = foxI >= 0 && rabI >= 0 && (Math.abs(foxI - rabI) === 1 || Math.abs(foxI - rabI) === 3);
  const friendsAdjacent = rabI >= 0 && crI >= 0 && (Math.abs(rabI - crI) === 1 || Math.abs(rabI - crI) === 3);

  setBeat('看他们');
  setHint('');

  // beat 1: friends greet if adjacent
  beatTimer = setTimeout(() => {
    clearPerfClasses();
    if (friendsAdjacent) {
      setBeat('好友');
      const a = charEl('rabbit'), b = charEl('crane');
      if (a) { a.classList.remove('idle'); a.classList.add('wave'); bubble('rabbit', '👋'); }
      if (b) { b.classList.remove('idle'); b.classList.add('nod'); bubble('crane', '🙂'); }
      setHint('');
    } else {
      setBeat('…');
      setHint('好友离远了');
    }
  }, 400);

  // beat 2: rivals awkward if adjacent
  perfTimer = setTimeout(() => {
    clearPerfClasses();
    if (rivalsAdjacent) {
      setBeat('仇人');
      const a = charEl('fox'), b = charEl('rabbit');
      if (a) { a.classList.remove('idle'); a.classList.add('look-away-left'); bubble('fox', '😒'); }
      if (b) { b.classList.remove('idle'); b.classList.add('look-away-right','bristle'); bubble('rabbit', '💢'); }
      setHint('');
    } else {
      setBeat('清净');
      const a = charEl('fox'), b = charEl('rabbit');
      if (a) { a.classList.remove('idle'); a.classList.add('happy'); }
      if (b && friendsAdjacent) { b.classList.remove('idle'); b.classList.add('happy'); bubble('rabbit', '✨'); }
      setHint('');
    }
  }, 2200);

  // beat 3: settle + soft cue only if stuck
  setTimeout(() => {
    if (rivalsAdjacent) {
      setBeat('换个座？');
      setHint('点角色，再点空位');
    } else if (friendsAdjacent) {
      setBeat('成了');
      setHint('');
      clearPerfClasses();
      ['rabbit','crane'].forEach(id => {
        const el = charEl(id);
        if (el) { el.classList.remove('idle'); el.classList.add('happy'); }
      });
      bubble('crane', '✨');
    } else {
      setBeat('再试试');
      setHint('把好友挨近，把仇人分开');
    }
  }, 4000);

  // loop performance while idle
  setTimeout(() => {
    if (!selected) playLoop();
  }, 7000);
}

function onSeat(i) {
  const who = seats[i];
  if (selected === null) {
    if (!who) { setHint('先点一只动物'); return; }
    selected = i;
    setHint('再点空位（或另一只交换）');
    setBeat('挪座');
    render();
    return;
  }
  if (selected === i) {
    selected = null;
    setHint('');
    render();
    playLoop();
    return;
  }
  // swap / move
  const a = seats[selected];
  const b = seats[i];
  seats[selected] = b;
  seats[i] = a;
  selected = null;
  setHint('');
  render();
  playLoop();
}

function shuffleNice() {
  // put friends together, rivals apart: fox, empty, rabbit, crane
  seats = ['fox', null, 'rabbit', 'crane'];
  selected = null;
  render();
  playLoop();
}

document.getElementById('btnReplay').addEventListener('click', () => {
  selected = null;
  render();
  playLoop();
});
document.getElementById('btnShuffle').addEventListener('click', shuffleNice);

render();
playLoop();
</script>
</body>
</html>
