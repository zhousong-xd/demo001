<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>这桌不能坐 · 表现候选 T-065</title>
<style>
:root {
  --bg0: #1a100c;
  --bg1: #2a1810;
  --wood1: #8b5a2b;
  --wood2: #5c3a1e;
  --wood3: #3d2414;
  --gold: #d4a84b;
  --cream: #f3e6d4;
  --muted: #b8a28a;
  --ok: #5ecf8a;
  --bad: #ff6b6b;
  --fox: #e8874a;
  --rabbit: #f0d0c8;
  --crane: #7eb8d8;
  --ink: #2a1a14;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; min-height: 100%;
  background: #0e0907; color: var(--cream);
  font-family: "PingFang SC", "Noto Sans SC", "Segoe UI", system-ui, sans-serif;
  user-select: none;
}
.stage-outer {
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
  padding: 10px 8px 20px;
}
.banner {
  width: 390px; max-width: 100%;
  margin-bottom: 8px; padding: 8px 10px;
  background: #f3e0d6; border: 2px solid #8b3a2a; border-radius: 10px;
  color: #8b3a2a; font-size: 12px; font-weight: 650; text-align: center;
}
.banner a { color: #6b2a1a; }
.banner small { display: block; margin-top: 3px; font-weight: 500; color: #7a6a58; font-size: 11px; }
.phone {
  width: 390px; max-width: 100%;
  height: 844px; max-height: calc(100vh - 70px);
  background:
    radial-gradient(ellipse 90% 50% at 50% 18%, rgba(212,168,75,.18), transparent 55%),
    radial-gradient(ellipse 70% 40% at 20% 90%, rgba(180,80,30,.15), transparent 50%),
    linear-gradient(180deg, #3a2218 0%, var(--bg1) 40%, var(--bg0) 100%);
  border-radius: 28px;
  border: 2px solid #4a3020;
  box-shadow: 0 16px 48px rgba(0,0,0,.6), inset 0 0 0 1px rgba(212,168,75,.15);
  overflow: hidden;
  display: flex; flex-direction: column;
  position: relative;
}
.phone::before {
  content: "";
  position: absolute; inset: 0; pointer-events: none; z-index: 0;
  opacity: .22;
  background:
    radial-gradient(circle at 18% 82%, #c4782a 0%, transparent 28%),
    radial-gradient(circle at 82% 85%, #c4782a 0%, transparent 26%);
}
.top {
  position: relative; z-index: 4;
  padding: 14px 14px 6px;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.mark {
  font-size: 13px; color: var(--gold); letter-spacing: .04em; font-weight: 650;
  display: flex; align-items: center; gap: 6px;
}
.mark .crest {
  width: 18px; height: 18px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #f0d080, var(--gold) 55%, #8a6020);
  box-shadow: 0 0 0 2px #6a4818;
}
.beat {
  font-size: 11px; color: var(--cream);
  background: rgba(60,36,24,.75);
  border: 1px solid rgba(212,168,75,.4);
  border-radius: 999px; padding: 4px 12px;
  min-width: 72px; text-align: center;
  transition: .2s;
}
.beat.ok { color: var(--ok); border-color: rgba(94,207,138,.5); }
.beat.bad { color: var(--bad); border-color: rgba(255,107,107,.55); }
.beat.warn { color: #ffb060; border-color: rgba(255,176,96,.5); }

.stage {
  flex: 1; position: relative; z-index: 2;
  margin: 4px 10px 0;
  border-radius: 18px;
  overflow: hidden;
}
/* layer: floor / rug */
.layer-floor {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 80% 70% at 50% 55%, #3a2418 0%, #241610 70%, #160e0a 100%);
}
.layer-floor::after {
  content: "";
  position: absolute; left: 8%; right: 8%; top: 12%; bottom: 8%;
  border-radius: 50%;
  background:
    repeating-radial-gradient(circle at 50% 50%,
      transparent 0 14px,
      rgba(90,60,40,.18) 14px 16px);
  opacity: .55;
  border: 2px solid rgba(90,60,40,.35);
}

/* layer: table */
.layer-table {
  position: absolute; left: 50%; top: 48%;
  width: 210px; height: 210px;
  margin: -105px 0 0 -105px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 45% 38%, #a07040 0%, var(--wood1) 35%, var(--wood2) 68%, var(--wood3) 100%);
  box-shadow:
    0 0 0 8px #4a3018,
    0 0 0 12px #2a180c,
    0 18px 28px rgba(0,0,0,.45),
    inset 0 0 24px rgba(0,0,0,.25);
  z-index: 1;
}
.table-top {
  position: absolute; inset: 18px;
  border-radius: 50%;
  border: 1px solid rgba(212,168,75,.2);
  pointer-events: none;
}
.centerpiece {
  position: absolute; left: 50%; top: 50%;
  width: 54px; height: 54px; margin: -27px 0 0 -27px;
  z-index: 2; pointer-events: none;
}
.dishes {
  position: absolute; inset: 0; z-index: 2; pointer-events: none;
}

/* seats + chairs (static layer) */
.layer-chairs {
  position: absolute; left: 50%; top: 48%;
  width: 0; height: 0; z-index: 3;
}
.seat-slot {
  position: absolute;
  width: 88px; height: 100px;
  margin: -50px 0 0 -44px;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  cursor: pointer;
  touch-action: manipulation;
  border: none; background: transparent; padding: 0;
}
.seat-slot:focus { outline: none; }
.seat-slot .chair-wrap {
  width: 78px; height: 64px;
  pointer-events: none;
  transition: transform .25s, filter .25s;
  filter: drop-shadow(0 4px 6px rgba(0,0,0,.4));
}
.seat-slot .chair-wrap svg { width: 100%; height: 100%; display: block; overflow: visible; }
.seat-slot.hot .chair-wrap { transform: scale(1.06); filter: drop-shadow(0 0 8px rgba(212,168,75,.55)); }
.seat-slot.hot-friend .chair-wrap { filter: drop-shadow(0 0 10px rgba(94,207,138,.65)); }
.seat-slot.hot-rival .chair-wrap { filter: drop-shadow(0 0 10px rgba(255,107,107,.7)); animation: shiver .35s linear 2; }
@keyframes shiver {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-3px); }
  75% { transform: translateX(3px); }
}
.seat-hit {
  position: absolute; inset: 10px 4px 0;
  border-radius: 16px;
}

/* characters live in a walker layer so they can move on the arc */
.layer-actors {
  position: absolute; left: 50%; top: 48%;
  width: 0; height: 0; z-index: 5;
  pointer-events: none;
}
.actor {
  position: absolute;
  width: 72px; height: 78px;
  margin: -62px 0 0 -36px;
  transform-origin: 50% 80%;
  pointer-events: none;
  transition: none;
}
.actor .body {
  width: 100%; height: 100%;
  position: relative;
}
.actor .body svg { width: 100%; height: 100%; display: block; overflow: visible; }
.actor.idle .body { animation: breathe 2.8s ease-in-out infinite; }
@keyframes breathe {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}
.actor.held .body {
  animation: none;
  transform: translateY(-18px) scale(1.08);
  filter: drop-shadow(0 10px 12px rgba(0,0,0,.45));
}
.actor.walking .body {
  animation: walkBob .28s ease-in-out infinite;
}
@keyframes walkBob {
  0%,100% { transform: translateY(-10px) rotate(-4deg); }
  50% { transform: translateY(-16px) rotate(4deg); }
}
.actor.refuse .body {
  animation: refusePose .55s ease-out forwards;
}
@keyframes refusePose {
  0% { transform: translateY(-8px) scale(1); }
  40% { transform: translateY(-22px) scale(1.05); }
  100% { transform: translateY(-14px) scale(1.02) rotate(-6deg); }
}
.actor.bounce .body {
  animation: bounceBack .55s cubic-bezier(.2,.8,.2,1);
}
@keyframes bounceBack {
  0% { transform: translateY(-12px); }
  35% { transform: translateY(-4px) translateX(8px); }
  100% { transform: translateY(0); }
}
.actor.greet .body { animation: wave .7s ease-in-out 2; }
@keyframes wave {
  0%,100% { transform: rotate(0); }
  25% { transform: rotate(-12deg); }
  55% { transform: rotate(10deg); }
}
.actor.clash .body { animation: clash .45s ease-out; }
@keyframes clash {
  0% { transform: scale(1); }
  30% { transform: translateX(8px) rotate(8deg) scale(1.06); }
  100% { transform: scale(1); }
}
.actor.happy .body { animation: happy .7s ease-in-out 2; }
@keyframes happy {
  0%,100% { transform: translateY(0); }
  40% { transform: translateY(-8px) scale(1.05); }
}
.actor.bristle .body { animation: bristle .4s ease-in-out 3; }
@keyframes bristle {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.08); filter: saturate(1.35); }
}

.bubble {
  position: absolute; left: 50%; top: -2px;
  transform: translate(-50%, -100%) scale(.7);
  font-size: 15px; line-height: 1.1;
  padding: 4px 8px;
  background: #fffaf3; color: var(--ink);
  border-radius: 12px;
  border: 1.5px solid #e8d4b8;
  box-shadow: 0 3px 8px rgba(0,0,0,.25);
  opacity: 0; pointer-events: none;
  white-space: nowrap;
  transition: opacity .18s, transform .18s;
  font-weight: 700; font-size: 13px;
}
.bubble::after {
  content: "";
  position: absolute; left: 50%; bottom: -6px;
  margin-left: -5px;
  border: 5px solid transparent;
  border-top-color: #fffaf3;
}
.bubble.on { opacity: 1; transform: translate(-50%, -112%) scale(1); }
.bubble.bad { background: #ffe8e4; border-color: #ffb0a8; color: #a02828; }
.bubble.bad::after { border-top-color: #ffe8e4; }
.bubble.ok { background: #e8fff0; border-color: #a8e8c0; color: #1a6a3a; }
.bubble.ok::after { border-top-color: #e8fff0; }

.fx-layer {
  position: absolute; left: 50%; top: 48%;
  width: 0; height: 0; z-index: 6;
  pointer-events: none;
}
.fx-pop {
  position: absolute;
  font-size: 18px;
  animation: popFade .7s ease-out forwards;
}
@keyframes popFade {
  0% { opacity: 1; transform: translate(-50%, -50%) scale(.6); }
  100% { opacity: 0; transform: translate(-50%, -90%) scale(1.2); }
}

.dock {
  position: relative; z-index: 4;
  padding: 8px 14px 16px;
  background: linear-gradient(180deg, transparent, rgba(0,0,0,.45));
}
.hint {
  font-size: 12px; color: var(--muted);
  min-height: 1.35em; text-align: center; margin-bottom: 8px;
}
.escalate-bar {
  height: 6px; border-radius: 999px;
  background: rgba(255,255,255,.08);
  overflow: hidden; margin: 0 auto 8px; width: 70%;
  opacity: 0; transition: opacity .2s;
}
.escalate-bar.on { opacity: 1; }
.escalate-bar > i {
  display: block; height: 100%; width: 0%;
  background: linear-gradient(90deg, #ffb060, #ff6b6b);
  transition: width .25s linear;
}
.tools { display: flex; gap: 8px; justify-content: center; }
.btn {
  border: 1px solid rgba(212,168,75,.4);
  background: rgba(60,36,24,.85); color: var(--cream);
  border-radius: 12px; padding: 10px 14px; font-size: 13px;
  min-height: 42px; cursor: pointer;
}
.btn:active { transform: scale(.97); }
.btn.primary { border-color: var(--gold); color: var(--gold); }
.outside {
  width: 390px; max-width: 100%; margin-top: 10px;
  font-size: 12px; color: #9a9084; text-align: center; line-height: 1.45;
}
.busy .seat-slot { pointer-events: none; }

.fx-clash {
  position: absolute;
  width: 96px; height: auto;
  transform: translate(-50%, -50%);
  animation: popFade .65s ease-out forwards;
  pointer-events: none;
}


.actor .body .char-img {
  width: 100%; height: 100%; object-fit: contain; display: block;
  filter: drop-shadow(0 4px 6px rgba(0,0,0,.35));
  pointer-events: none;
}
.seat-slot .chair-wrap .chair-img {
  width: 100%; height: 100%; object-fit: contain; display: block;
  pointer-events: none;
}
.actor { width: 84px; height: 96px; margin: -78px 0 0 -42px; }
.seat-slot { width: 96px; height: 110px; margin: -55px 0 0 -48px; }
.seat-slot .chair-wrap { width: 88px; height: 78px; }

</style>
</head>
<body>
<div class="stage-outer">
  <div class="banner" role="status">
    表现候选 / 非正式 — 不是正式三关
    <small>正式主链：<a href="https://zhousong-xd.github.io/demo001/">https://zhousong-xd.github.io/demo001/</a></small>
  </div>
  <div class="phone" id="phone" aria-label="表现小样 390x844">

    <div class="stage" id="stage">
      <div class="layer-floor" data-layer="floor"></div>

        <svg class="dishes" viewBox="0 0 210 210" aria-hidden="true">
          <ellipse cx="105" cy="70" rx="18" ry="10" fill="#6a4028" opacity=".85"/>
          <ellipse cx="105" cy="68" rx="14" ry="7" fill="#c8e070" opacity=".9"/>
          <ellipse cx="70" cy="110" rx="16" ry="9" fill="#6a4028" opacity=".85"/>
          <circle cx="64" cy="108" r="4" fill="#f0e8d8"/><circle cx="72" cy="110" r="4" fill="#f0e8d8"/><circle cx="80" cy="108" r="4" fill="#f0e8d8"/>
          <ellipse cx="140" cy="110" rx="16" ry="9" fill="#6a4028" opacity=".85"/>
          <circle cx="134" cy="108" r="3.5" fill="#a85830"/><circle cx="142" cy="110" r="3.5" fill="#a85830"/><circle cx="148" cy="107" r="3.5" fill="#a85830"/>
          <ellipse cx="105" cy="145" rx="12" ry="7" fill="#5a3820" opacity=".7"/>

          <ellipse cx="27" cy="40" rx="14" ry="6" fill="#4a3020" opacity=".5"/>
          <rect x="22" y="22" width="10" height="16" rx="3" fill="#c8b090"/>
          <ellipse cx="27" cy="20" rx="10" ry="8" fill="#f0c060"/>
          <circle cx="27" cy="16" r="4" fill="#fff4c8" opacity=".9"/>
          <circle cx="18" cy="28" r="4" fill="#e888a8"/><circle cx="36" cy="28" r="4" fill="#e888a8"/>

      </div>
      <div class="layer-chairs" id="chairs" data-layer="chairs"></div>

        <button class="btn primary" type="button" id="btnReset">开席</button>
      </div>

  </div>
  <p class="outside">T-065 · 走路换座 / 拒坐 / 不管升级 / 遇人招呼·冲突 · 分层可换素材</p>

<script>
/** T-065 presentation sample — layered movable SVG placeholders (T-064 swap via assets/) */
const REL = {
  fox: { rival: 'rabbit', friend: null },
  rabbit: { rival: 'fox', friend: 'crane' },
  crane: { rival: null, friend: 'rabbit' },
};
const COLOR = { fox: '#e8874a', rabbit: '#f0d0c8', crane: '#7eb8d8' };
const LABEL = { fox: '狐', rabbit: '兔', crane: '鹤' };
/** T-064 layered PNGs (fallback to inline SVG if missing) */
const ASSET_CHAR = {
  fox: { idle: 'assets/chars/fox_idle.png', awkward: 'assets/chars/fox_awkward.png', mad: 'assets/chars/fox_mad.png',
         refuse: 'assets/chars/fox_mad.png', happy: 'assets/chars/fox_idle.png', walk: 'assets/chars/fox_idle.png' },
  rabbit: { idle: 'assets/chars/rabbit_idle.png', mad: 'assets/chars/rabbit_mad.png', refuse: 'assets/chars/rabbit_refuse_stand.png',
            happy: 'assets/chars/rabbit_greet.png', walk: 'assets/chars/rabbit_walk.png', greet: 'assets/chars/rabbit_greet.png' },
  crane: { idle: 'assets/chars/crane_idle.png', happy: 'assets/chars/crane_happy.png', mad: 'assets/chars/crane_idle.png',
           refuse: 'assets/chars/crane_idle.png', walk: 'assets/chars/crane_idle.png' },
};
const ASSET_CHAIR = {
  stool: 'assets/chairs/chair_stool.png',
  round: 'assets/chairs/chair_round.png',
  spike: 'assets/chairs/chair_spike.png',
  classic: 'assets/chairs/chair_host.png',
};
const USE_PNG = true; // layered movable imgs — NOT a full-bleed mockup

/** seat angles (deg): 0=right, 90=bottom, 180=left, 270=top — walk along table arc */
const SEAT_ANGLE = [270, 0, 90, 180];
const RADIUS = 148; // px from table center to actor pivot

let seats = ['fox', 'crane', 'rabbit', null]; // 3 seated + 1 empty; fox↔rabbit not adj; rabbit↔crane friend
let selected = null;
let busy = false;
let escalateLv = 0;
let escalateTimer = null;
let escalateTick = null;
let actorEls = {}; // id -> DOM
let seatEls = [];
let tipMode = false;

function setBeat(t, kind) {
  const el = document.getElementById('beat');
  el.textContent = t;
  el.className = 'beat' + (kind ? ' ' + kind : '');
}
function setHint(t) { document.getElementById('hint').textContent = t || ''; }
function phoneBusy(on) {
  busy = on;
  document.getElementById('phone').classList.toggle('busy', on);
}

function polar(angleDeg) {
  const a = (angleDeg * Math.PI) / 180;
  return { x: Math.cos(a) * RADIUS, y: Math.sin(a) * RADIUS };
}
function shortestArc(from, to) {
  let d = ((to - from + 540) % 360) - 180;
  /* 180° ties: prefer arc that passes a seated character (walk-by readable) */
  if (Math.abs(d) === 180) {
    d = 180; // positive direction first; seatsOnArc will list passed seats
  }
  return { delta: d, steps: Math.max(12, Math.round(Math.abs(d) / 8)) };
}
function preferArc(fromIdx, toIdx) {
  const fromA = angleAtSeat(fromIdx), toA = angleAtSeat(toIdx);
  let d = ((toA - fromA + 540) % 360) - 180;
  if (Math.abs(d) !== 180) {
    return { delta: d, steps: Math.max(12, Math.round(Math.abs(d) / 8)), fromA, toA };
  }
  const score = (dirs) => seatsOnArc(fromIdx, toIdx, dirs).filter(i => seats[i]).length;
  d = score(1) >= score(-1) ? 180 : -180;
  return { delta: d, steps: Math.max(12, Math.round(180 / 8)), fromA, toA };
}
function angleAtSeat(i) { return SEAT_ANGLE[i]; }
function seatIndexOf(who) { return seats.indexOf(who); }
function adj(i, j) {
  if (i < 0 || j < 0) return false;
  const d = Math.abs(i - j);
  return d === 1 || d === 3;
}
function neighbors(i) {
  return [(i + 1) % 4, (i + 3) % 4].map(j => seats[j]).filter(Boolean);
}
function rivalsAdjacent() {
  const a = seats.indexOf('fox'), b = seats.indexOf('rabbit');
  return adj(a, b);
}
function friendsAdjacent() {
  const a = seats.indexOf('rabbit'), b = seats.indexOf('crane');
  return adj(a, b);
}

/** Arc seats passed when walking from→to (exclusive of endpoints) */
function seatsOnArc(fromIdx, toIdx, delta) {
  const dirs = delta >= 0 ? 1 : -1;
  const passed = [];
  let cur = fromIdx;
  for (let n = 0; n < 3; n++) {
    cur = (cur + dirs + 4) % 4;
    if (cur === toIdx) break;
    passed.push(cur);
  }
  return passed;
}

function face(mood) {
  if (mood === 'happy') return `
    <path d="M28 40 Q32 36 36 40" stroke="#2a1a18" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M44 40 Q48 36 52 40" stroke="#2a1a18" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M34 50 Q40 56 46 50" stroke="#2a1a18" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
  if (mood === 'mad') return `
    <path d="M24 34 L34 38" stroke="#2a1a18" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M56 34 L46 38" stroke="#2a1a18" stroke-width="2.2" stroke-linecap="round"/>
    <ellipse cx="30" cy="42" rx="3.2" ry="3.6" fill="#2a1a18"/>
    <ellipse cx="50" cy="42" rx="3.2" ry="3.6" fill="#2a1a18"/>
    <path d="M34 52 Q40 48 46 52" stroke="#2a1a18" stroke-width="2" fill="none"/>`;
  if (mood === 'refuse') return `
    <path d="M24 34 L34 38" stroke="#2a1a18" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M56 34 L46 38" stroke="#2a1a18" stroke-width="2.2" stroke-linecap="round"/>
    <ellipse cx="30" cy="42" rx="3.2" ry="3.6" fill="#2a1a18"/>
    <ellipse cx="50" cy="42" rx="3.2" ry="3.6" fill="#2a1a18"/>
    <path d="M33 54 L47 54" stroke="#2a1a18" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M18 22 L10 14" stroke="#ff6b6b" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M62 22 L70 14" stroke="#ff6b6b" stroke-width="2.2" stroke-linecap="round"/>`;
  if (mood === 'awkward') return `
    <ellipse cx="30" cy="40" rx="3" ry="3.5" fill="#2a1a18"/>
    <ellipse cx="50" cy="40" rx="3" ry="3.5" fill="#2a1a18"/>
    <path d="M34 52 Q40 48 46 52" stroke="#2a1a18" stroke-width="2" fill="none"/>`;
  return `
    <ellipse cx="30" cy="40" rx="3.2" ry="3.8" fill="#2a1a18"/>
    <ellipse cx="50" cy="40" rx="3.2" ry="3.8" fill="#2a1a18"/>
    <circle cx="31.2" cy="38.6" r="1" fill="#fff" opacity=".7"/>
    <circle cx="51.2" cy="38.6" r="1" fill="#fff" opacity=".7"/>
    <path d="M34 52 Q40 54 46 52" stroke="#2a1a18" stroke-width="1.8" fill="none" stroke-linecap="round"/>`;
}


function charVisual(id, mood) {
  const m = mood || 'idle';
  if (USE_PNG && ASSET_CHAR[id]) {
    const map = ASSET_CHAR[id];
    const src = map[m] || map.idle;
    /* onerror → inline SVG placeholder (Pages without assets still playable) */
    return `<img class="char-img" data-asset="char-${id}" data-mood="${m}" src="${src}" alt="${LABEL[id]}" draggable="false" onerror="this.outerHTML=svgChar('${id}','${m}')" />`;
  }
  return svgChar(id, m);
}
function chairVisual(kind) {
  const k = kind === 'empty' ? 'stool' : kind === 'friend' ? 'round' : kind === 'rival' ? 'spike' : (kind === 'stool' || kind === 'round' || kind === 'spike' || kind === 'classic') ? kind : 'classic';
  if (USE_PNG && ASSET_CHAIR[k]) {
    return `<img class="chair-img" data-asset="chair-${k}" src="${ASSET_CHAIR[k]}" alt="" draggable="false" onerror="this.outerHTML=chairSvg('${k}')" />`;
  }
  return chairSvg(kind);
}

function svgChar(id, mood) {
  const c = COLOR[id], f = face(mood || 'idle'), lab = LABEL[id];
  /* data-asset slots for T-064 replacement */
  if (id === 'fox') return `<svg viewBox="0 0 80 80" data-asset="char-fox" data-mood="${mood||'idle'}">
    <circle cx="40" cy="46" r="22" fill="${c}"/>
    <polygon points="16,36 20,8 34,34" fill="${c}"/><polygon points="46,34 60,8 64,36" fill="${c}"/>
    <polygon points="20,30 22,14 30,30" fill="#f3d2b0" opacity=".85"/>
    <polygon points="50,30 58,14 60,30" fill="#f3d2b0" opacity=".85"/>
    <ellipse cx="40" cy="54" rx="10" ry="7" fill="#f3d2b0" opacity=".92"/>${f}
    <text x="40" y="78" text-anchor="middle" font-size="10" fill="#c8b090">${lab}</text></svg>`;
  if (id === 'rabbit') return `<svg viewBox="0 0 80 80" data-asset="char-rabbit" data-mood="${mood||'idle'}">
    <ellipse cx="28" cy="16" rx="7" ry="16" fill="${c}"/><ellipse cx="52" cy="16" rx="7" ry="16" fill="${c}"/>
    <ellipse cx="28" cy="14" rx="3.5" ry="10" fill="#f8e8e4"/><ellipse cx="52" cy="14" rx="3.5" ry="10" fill="#f8e8e4"/>
    <circle cx="40" cy="46" r="22" fill="${c}"/>${f}
    <ellipse cx="40" cy="56" rx="7" ry="5" fill="#e8b0b0" opacity=".55"/>
    <text x="40" y="78" text-anchor="middle" font-size="10" fill="#c8b090">${lab}</text></svg>`;
  return `<svg viewBox="0 0 80 80" data-asset="char-crane" data-mood="${mood||'idle'}">
    <ellipse cx="40" cy="20" rx="11" ry="13" fill="${c}"/>
    <path d="M50 18 Q72 4 68 28 Q62 38 50 30" fill="${c}"/>
    <path d="M28 22 L18 28 L28 26" fill="#e85840"/>
    <circle cx="40" cy="48" r="20" fill="${c}"/>
    <path d="M40 8 L42 2 L38 2 Z" fill="#e85840"/>${f}
    <text x="40" y="78" text-anchor="middle" font-size="10" fill="#c8b090">${lab}</text></svg>`;
}

function chairSvg(kind) {
  if (kind === 'empty' || kind === 'stool') {
    return `<svg class="chair-svg stool" viewBox="0 0 80 70" data-asset="chair-stool" aria-hidden="true">
      <ellipse cx="40" cy="38" rx="26" ry="12" fill="#6a4a30" stroke="#a08060" stroke-width="2"/>
      <path d="M18 36 Q40 18 62 36" fill="none" stroke="#8a6848" stroke-width="3" stroke-linecap="round"/>
      <rect x="20" y="46" width="6" height="16" rx="1" fill="#4a3020"/>
      <rect x="54" y="46" width="6" height="16" rx="1" fill="#4a3020"/>
      <rect x="37" y="48" width="6" height="14" rx="1" fill="#4a3020"/>
    </svg>`;
  }
  if (kind === 'friend' || kind === 'round') {
    return `<svg class="chair-svg round" viewBox="0 0 80 70" data-asset="chair-round" aria-hidden="true">
      <path d="M16 38 Q40 -4 64 38" fill="#3a6a50" stroke="#5ecf8a" stroke-width="2.5"/>
      <ellipse cx="40" cy="42" rx="28" ry="14" fill="#2f5a48" stroke="#5ecf8a" stroke-width="2"/>
      <ellipse cx="40" cy="40" rx="20" ry="8" fill="#4a8a68" opacity=".5"/>
      <rect x="14" y="52" width="10" height="14" rx="2" fill="#5a4534"/>
      <rect x="56" y="52" width="10" height="14" rx="2" fill="#5a4534"/>
    </svg>`;
  }
  if (kind === 'rival' || kind === 'spike') {
    return `<svg class="chair-svg spike" viewBox="0 0 80 70" data-asset="chair-spike" aria-hidden="true">
      <path d="M22 40 L28 8 L34 40 Z" fill="#d4a84b" stroke="#8a6020" stroke-width="1"/>
      <path d="M36 40 L40 2 L44 40 Z" fill="#d4a84b" stroke="#8a6020" stroke-width="1"/>
      <path d="M46 40 L52 8 L58 40 Z" fill="#d4a84b" stroke="#8a6020" stroke-width="1"/>
      <path d="M18 38 L62 38 L58 18 L22 18 Z" fill="#8a3040" stroke="#ff6b6b" stroke-width="2"/>
      <rect x="14" y="36" width="52" height="16" rx="3" fill="#6b3a42" stroke="#ff6b6b" stroke-width="1.5"/>
      <rect x="16" y="52" width="9" height="14" fill="#4a3028"/>
      <rect x="55" y="52" width="9" height="14" fill="#4a3028"/>
    </svg>`;
  }
  /* solo classic warm chair */
  return `<svg class="chair-svg classic" viewBox="0 0 80 70" data-asset="chair-classic" aria-hidden="true">
    <path d="M20 12 Q40 2 60 12 L60 36 L20 36 Z" fill="#5a3a58" stroke="#d4a84b" stroke-width="2"/>
    <rect x="14" y="34" width="52" height="16" rx="4" fill="#4a3050" stroke="#d4a84b" stroke-width="1.5"/>
    <rect x="16" y="50" width="10" height="14" fill="#5a4534"/>
    <rect x="54" y="50" width="10" height="14" fill="#5a4534"/>
  </svg>`;
}

function chairKindFor(i, who) {
  if (!who) return 'stool';
  const ns = neighbors(i);
  const hasFriend = REL[who].friend && ns.includes(REL[who].friend);
  const hasRival = REL[who].rival && ns.includes(REL[who].rival);
  if (hasRival) return 'spike';
  if (hasFriend) return 'round';
  return 'classic';
}

function moodFor(who) {
  if (!who) return 'idle';
  const i = seats.indexOf(who);
  if (i < 0) return 'idle';
  const ns = neighbors(i);
  if (REL[who].rival && ns.includes(REL[who].rival)) return who === 'fox' ? 'awkward' : 'mad';
  if (REL[who].friend && ns.includes(REL[who].friend)) return 'happy';
  return 'idle';
}

function placeActor(el, angleDeg) {
  const p = polar(angleDeg);
  el.style.left = p.x + 'px';
  el.style.top = p.y + 'px';
  el.dataset.angle = String(angleDeg);
}

function showBubble(who, text, kind) {
  const el = actorEls[who];
  if (!el) return;
  const b = el.querySelector('.bubble');
  b.textContent = text;
  b.className = 'bubble on' + (kind ? ' ' + kind : '');
}
function hideBubbles() {
  Object.values(actorEls).forEach(el => {
    const b = el.querySelector('.bubble');
    if (b) { b.className = 'bubble'; b.textContent = ''; }
  });
}
function fxPop(angleDeg, emoji) {
  const layer = document.getElementById('fx');
  const p = polar(angleDeg);
  const n = document.createElement('div');
  n.className = 'fx-pop';
  n.textContent = emoji;
  n.style.left = p.x + 'px';
  n.style.top = (p.y - 40) + 'px';
  layer.appendChild(n);
  setTimeout(() => n.remove(), 700);
}
function fxClash(angleDeg) {
  const layer = document.getElementById('fx');
  const p = polar(angleDeg);
  const n = document.createElement('img');
  n.src = 'assets/fx/fx_clash.png';
  n.alt = '';
  n.className = 'fx-clash';
  n.style.left = p.x + 'px';
  n.style.top = (p.y - 20) + 'px';
  layer.appendChild(n);
  setTimeout(() => n.remove(), 650);
}


function rebuildChairs() {
  const root = document.getElementById('chairs');
  root.innerHTML = '';
  seatEls = [];
  for (let i = 0; i < 4; i++) {
    const who = seats[i];
    const ang = angleAtSeat(i);
    const p = polar(ang);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'seat-slot';
    btn.dataset.seat = String(i);
    btn.style.left = p.x + 'px';
    btn.style.top = (p.y + 18) + 'px';
    btn.setAttribute('aria-label', who ? LABEL[who] : '空座');
    const wrap = document.createElement('div');
    wrap.className = 'chair-wrap';
    wrap.innerHTML = chairVisual(chairKindFor(i, who));
    btn.appendChild(wrap);
    btn.addEventListener('click', () => onSeat(i));
    btn.addEventListener('pointerenter', () => onHover(i, true));
    btn.addEventListener('pointerleave', () => onHover(i, false));
    root.appendChild(btn);
    seatEls[i] = btn;
  }
}

function rebuildActors() {
  const root = document.getElementById('actors');
  root.innerHTML = '';
  actorEls = {};
  seats.forEach((who, i) => {
    if (!who) return;
    const el = document.createElement('div');
    el.className = 'actor idle';
    el.dataset.char = who;
    el.innerHTML = `<div class="bubble"></div><div class="body">${charVisual(who, moodFor(who))}</div>`;
    placeActor(el, angleAtSeat(i));
    root.appendChild(el);
    actorEls[who] = el;
  });
}

function refreshFaces() {
  Object.keys(actorEls).forEach(who => {
    const el = actorEls[who];
    if (!el || el.classList.contains('walking') || el.classList.contains('held') || el.classList.contains('refuse')) return;
    const body = el.querySelector('.body');
    const mood = moodFor(who);
    body.innerHTML = charVisual(who, mood);
  });
}

function clearSeatHot() {
  seatEls.forEach(s => s && s.classList.remove('hot', 'hot-friend', 'hot-rival'));
}

function wouldRefuse(who, targetIdx) {
  /* refuse sit: empty seat whose neighbors include rival (after placing who there) */
  if (seats[targetIdx]) return false; // swaps allowed
  const trial = seats.slice();
  const from = trial.indexOf(who);
  trial[from] = null;
  trial[targetIdx] = who;
  const ns = [(targetIdx + 1) % 4, (targetIdx + 3) % 4].map(j => trial[j]).filter(Boolean);
  return !!(REL[who].rival && ns.includes(REL[who].rival));
}

function hoverKind(who, targetIdx) {
  if (wouldRefuse(who, targetIdx)) return 'rival';
  const trial = seats.slice();
  const from = trial.indexOf(who);
  const other = trial[targetIdx];
  trial[from] = other;
  trial[targetIdx] = who;
  const ns = [(targetIdx + 1) % 4, (targetIdx + 3) % 4].map(j => trial[j]).filter(Boolean);
  if (REL[who].friend && ns.includes(REL[who].friend)) return 'friend';
  if (REL[who].rival && ns.includes(REL[who].rival)) return 'rival';
  return 'ok';
}

function onHover(i, on) {
  if (busy || selected === null) return;
  const who = seats[selected];
  if (!who || selected === i) return;
  clearSeatHot();
  if (!on) return;
  const k = hoverKind(who, i);
  seatEls[i].classList.add(k === 'friend' ? 'hot-friend' : k === 'rival' ? 'hot-rival' : 'hot');
}

function stopEscalate() {
  if (escalateTimer) clearTimeout(escalateTimer);
  if (escalateTick) clearInterval(escalateTick);
  escalateTimer = escalateTick = null;
  escalateLv = 0;
  const bar = document.getElementById('escBar');
  const fill = document.getElementById('escFill');
  bar.classList.remove('on');
  fill.style.width = '0%';
}

function startEscalate() {
  stopEscalate();
  if (!rivalsAdjacent()) return;
  const bar = document.getElementById('escBar');
  const fill = document.getElementById('escFill');
  bar.classList.add('on');
  setBeat('修罗场', 'bad');
  setHint('不管会升级… 拉开他们');
  showBubble('fox', '…', 'bad');
  showBubble('rabbit', '💢', 'bad');
  const fox = actorEls.fox, rab = actorEls.rabbit;
  if (fox) { fox.classList.remove('idle'); fox.classList.add('bristle'); }
  if (rab) { rab.classList.remove('idle'); rab.classList.add('bristle'); }

  let progress = 0;
  escalateTick = setInterval(() => {
    if (!rivalsAdjacent() || busy || selected !== null) return;
    progress += 4;
    fill.style.width = Math.min(100, progress) + '%';
    if (progress >= 33 && escalateLv < 1) {
      escalateLv = 1;
      showBubble('fox', '哼', 'bad');
      showBubble('rabbit', '💢💢', 'bad');
      setBeat('升级·1', 'warn');
      fxPop(angleAtSeat(seats.indexOf('rabbit')), '💢');
    }
    if (progress >= 66 && escalateLv < 2) {
      escalateLv = 2;
      showBubble('fox', '走开!', 'bad');
      showBubble('rabbit', '可恶!', 'bad');
      setBeat('升级·2', 'bad');
      if (fox) fox.classList.add('clash');
      if (rab) rab.classList.add('clash');
    }
    if (progress >= 100 && escalateLv < 3) {
      escalateLv = 3;
      showBubble('fox', '💥', 'bad');
      showBubble('rabbit', '💥', 'bad');
      setBeat('吵翻了', 'bad');
      setHint('快拉开！');
      fxPop(angleAtSeat(seats.indexOf('fox')), '💥');
      fxPop(angleAtSeat(seats.indexOf('rabbit')), '💥');
    }
  }, 280);
}

function afterSettle() {
  rebuildChairs();
  refreshFaces();
  hideBubbles();
  Object.values(actorEls).forEach(el => {
    el.className = 'actor idle';
  });
  if (rivalsAdjacent()) {
    startEscalate();
  } else {
    stopEscalate();
    if (friendsAdjacent()) {
      setBeat('成了', 'ok');
      showBubble('rabbit', '👋', 'ok');
      showBubble('crane', '✨', 'ok');
      const a = actorEls.rabbit, b = actorEls.crane;
      if (a) { a.classList.remove('idle'); a.classList.add('greet', 'happy'); }
      if (b) { b.classList.remove('idle'); b.classList.add('greet', 'happy'); }
      setHint('');
    } else {
      setBeat('…');
      setHint('点角色 → 点空座/换座');
    }
  }
}

function animateWalk(who, fromIdx, toIdx, opts) {
  return new Promise(resolve => {
    const el = actorEls[who];
    if (!el) { resolve({ passed: [] }); return; }
    const { delta, steps, fromA, toA } = preferArc(fromIdx, toIdx);
    const passed = seatsOnArc(fromIdx, toIdx, delta);
    el.classList.remove('idle', 'held', 'refuse', 'bounce');
    el.classList.add('walking');
    el.querySelector('.body').innerHTML = charVisual(who, 'walk');
    hideBubbles();
    let step = 0;
    const triggered = new Set();
    const iv = setInterval(() => {
      step++;
      const t = step / steps;
      const ang = fromA + delta * t;
      placeActor(el, ang);
      /* walk-by: when near a passed seat angle, greet/clash */
      passed.forEach(si => {
        if (triggered.has(si)) return;
        const sa = angleAtSeat(si);
        let diff = Math.abs(((ang - sa + 540) % 360) - 180);
        if (diff < 12) {
          triggered.add(si);
          const other = seats[si];
          if (!other) return;
          onWalkBy(who, other, si);
        }
      });
      if (step >= steps) {
        clearInterval(iv);
        placeActor(el, toA);
        el.classList.remove('walking');
        resolve({ passed, opts });
      }
    }, 28);
  });
}

function onWalkBy(walker, other, seatIdx) {
  const otherEl = actorEls[other];
  const wEl = actorEls[walker];
  if (REL[walker].friend === other || REL[other].friend === walker) {
    setBeat('打招呼', 'ok');
    showBubble(walker, '嗨', 'ok');
    showBubble(other, '👋', 'ok');
    if (wEl) {
      wEl.classList.remove('idle'); wEl.classList.add('greet');
      const b = wEl.querySelector('.body'); if (b) b.innerHTML = charVisual(walker, 'happy');
    }
    if (otherEl) {
      otherEl.classList.remove('idle'); otherEl.classList.add('greet');
      const b = otherEl.querySelector('.body'); if (b) b.innerHTML = charVisual(other, 'happy');
    }
    fxPop(angleAtSeat(seatIdx), '✨');
  } else if (REL[walker].rival === other || REL[other].rival === walker) {
    setBeat('撞一下', 'bad');
    showBubble(walker, '哼', 'bad');
    showBubble(other, '💢', 'bad');
    if (wEl) {
      wEl.classList.add('clash');
      const b = wEl.querySelector('.body'); if (b) b.innerHTML = charVisual(walker, 'mad');
    }
    if (otherEl) {
      otherEl.classList.remove('idle'); otherEl.classList.add('clash');
      const b = otherEl.querySelector('.body'); if (b) b.innerHTML = charVisual(other, 'mad');
    }
    fxPop(angleAtSeat(seatIdx), '💢');
    fxClash(angleAtSeat(seatIdx));
  }
}

async function doRefuse(who, fromIdx, targetIdx) {
  setBeat('拒坐', 'bad');
  setHint('站立拒坐');
  phoneBusy(true);
  /* approach partway along arc */
  const el = actorEls[who];
  const fromA = angleAtSeat(fromIdx);
  const toA = angleAtSeat(targetIdx);
  const { delta } = shortestArc(fromA, toA);
  const approach = fromA + delta * 0.55;
  el.classList.remove('idle', 'held');
  el.classList.add('walking');
  await new Promise(r => {
    let step = 0, steps = 10;
    const iv = setInterval(() => {
      step++;
      placeActor(el, fromA + (approach - fromA) * (step / steps));
      if (step >= steps) { clearInterval(iv); r(); }
    }, 30);
  });
  el.classList.remove('walking');
  el.classList.add('bounce', 'refuse');
  const body = el.querySelector('.body');
  body.innerHTML = charVisual(who, 'refuse');
  showBubble(who, '不坐', 'bad');
  fxPop(approach, '💢');
  await new Promise(r => setTimeout(r, 650));
  /* bounce back home */
  el.classList.remove('bounce');
  el.classList.add('walking');
  await new Promise(r => {
    let step = 0, steps = 12;
    const start = parseFloat(el.dataset.angle);
    const iv = setInterval(() => {
      step++;
      placeActor(el, start + (fromA - start) * (step / steps));
      if (step >= steps) { clearInterval(iv); r(); }
    }, 28);
  });
  placeActor(el, fromA);
  el.classList.remove('walking', 'refuse');
  el.classList.add('idle');
  body.innerHTML = charVisual(who, moodFor(who));
  hideBubbles();
  selected = null;
  clearSeatHot();
  phoneBusy(false);
  setBeat('不坐', 'bad');
  setHint('换别处试试');
  afterSettle();
}

async function doMove(who, fromIdx, toIdx) {
  phoneBusy(true);
  stopEscalate();
  hideBubbles();
  const other = seats[toIdx];
  setBeat(other ? '换座' : '落座');
  setHint('');
  const el = actorEls[who];
  if (el) el.classList.remove('held');

  /* if swap, briefly lift other then they'll land on fromIdx after walk */
  await animateWalk(who, fromIdx, toIdx, {});

  seats[fromIdx] = other;
  seats[toIdx] = who;

  if (other) {
    const otherEl = actorEls[other];
    if (otherEl) {
      /* slide other across shorter path without full walk-by spam */
      otherEl.classList.add('walking');
      const fromA = angleAtSeat(toIdx);
      const toA = angleAtSeat(fromIdx);
      const { delta, steps } = shortestArc(fromA, toA);
      await new Promise(r => {
        let step = 0;
        const iv = setInterval(() => {
          step++;
          placeActor(otherEl, fromA + delta * (step / steps));
          if (step >= steps) { clearInterval(iv); r(); }
        }, 22);
      });
      placeActor(otherEl, toA);
      otherEl.classList.remove('walking');
    }
  }

  selected = null;
  clearSeatHot();
  phoneBusy(false);
  afterSettle();
}

function onSeat(i) {
  if (busy) return;
  const who = seats[i];
  if (selected === null) {
    if (!who) return;
    selected = i;
    stopEscalate();
    hideBubbles();
    const el = actorEls[who];
    if (el) {
      el.classList.remove('idle', 'greet', 'clash', 'happy', 'bristle');
      el.classList.add('held');
    }
    setBeat('拿起');
    setHint('点空座落座，或点别人换座');
    return;
  }
  if (selected === i) {
    const w = seats[selected];
    if (actorEls[w]) {
      actorEls[w].classList.remove('held');
      actorEls[w].classList.add('idle');
    }
    selected = null;
    clearSeatHot();
    setHint('点角色 → 点空座/换座');
    afterSettle();
    return;
  }
  const from = selected;
  const mover = seats[from];
  if (!mover) { selected = null; return; }

  if (wouldRefuse(mover, i)) {
    const el = actorEls[mover];
    if (el) el.classList.remove('held');
    doRefuse(mover, from, i);
    return;
  }
  doMove(mover, from, i);
}

function reset() {
  stopEscalate();
  selected = null;
  busy = false;
  phoneBusy(false);
  seats = ['fox', 'crane', 'rabbit', null];
  clearSeatHot();
  rebuildChairs();
  rebuildActors();
  setBeat('开席');
  setHint('点角色 → 点空座/换座');
  setTimeout(afterSettle, 200);
}

function showTip() {
  tipMode = !tipMode;
  if (tipMode) {
    setHint('试：①兔→空座(拒坐) ②狐↔兔对座(走路遇鹤) ③换到挨坐等升级');
    setBeat('提示');
  } else {
    setHint('点角色 → 点空座/换座');
  }
}

document.getElementById('btnReset').addEventListener('click', reset);
document.getElementById('btnTip').addEventListener('click', showTip);

reset();
</script>
