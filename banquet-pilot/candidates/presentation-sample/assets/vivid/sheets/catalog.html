<!doctype html>
<meta charset="utf-8">
<title>T-067 sheets catalog</title>
<style>
body{font-family:system-ui,sans-serif;margin:20px;background:#120e16;color:#f2e8d8}
h1{font-size:1.1rem} h2{color:#e8c98a;font-size:.95rem;margin-top:22px}
.row{background:#221a28;border-radius:10px;padding:10px;margin:8px 0}
.row img{max-width:100%;height:auto;image-rendering:auto;background:#000}
code{font-size:11px;color:#bca}
.play{display:inline-block;width:96px;height:112px;background-repeat:no-repeat;background-size:auto 112px;vertical-align:middle;margin-left:12px}
</style>
<h1>T-067 精灵表 · 切帧预览</h1>
<p>建议 walk 8fps · idle 6fps · rise/sit 8fps · refuse 6fps</p>
<div id="list"></div>
<script>
const who=['fox','rabbit','crane'];
const anims=[
  ['walk',4,8],['idle',6,6],['rise',3,8],['sit',3,8],['refuse',3,6]
];
const root=document.getElementById('list');
for(const w of who){
  const h=document.createElement('h2'); h.textContent=w; root.appendChild(h);
  for(const [a,count,fps] of anims){
    const div=document.createElement('div'); div.className='row';
    const src=`${w}_${a}.png`;
    div.innerHTML=`<code>${src}</code> · ${count}帧 · ${fps}fps<br><img src="${src}" alt="${src}">`;
    const prev=document.createElement('div'); prev.className='play';
    prev.style.backgroundImage=`url(${src})`;
    let i=0; setInterval(()=>{ prev.style.backgroundPosition=`-${i*96}px 0`; i=(i+1)%count; }, 1000/fps);
    // also use root 96 strips for tiny preview
    prev.style.backgroundImage=`url(../${w}_${a}.png)`;
    div.appendChild(prev);
    root.appendChild(div);
  }
}
</script>
