<!doctype html>
<meta charset="utf-8">
<title>T-067 vivid 分层 catalog</title>
<style>
body{font-family:system-ui,sans-serif;margin:24px;background:#141018;color:#f3e8d8}
h1{font-size:1.15rem} h2{color:#e8c98a;font-size:1rem;margin-top:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{background:#241c2c;border-radius:12px;padding:10px;text-align:center}
.card img{max-width:100%;max-height:160px;object-fit:contain;background:
  linear-gradient(45deg,#333 25%,transparent 25%),linear-gradient(-45deg,#333 25%,transparent 25%),
  linear-gradient(45deg,transparent 75%,#333 75%),linear-gradient(-45deg,transparent 75%,#333 75%);
  background-size:14px 14px;background-position:0 0,0 7px,7px -7px,-7px 0;border-radius:8px}
code{font-size:11px;color:#cbb;display:block;margin-top:6px}
a{color:#9cf}
</style>
<h1>T-067 生动分层 <a href="ASSETS.md">ASSETS.md</a></h1>
<script>
const data={
fox:['parts_kit','heads','pose_sit','pose_rise','pose_walk','pose_refuse','pose_mad'],
rabbit:['parts_kit','heads','pose_sit','pose_rise','pose_walk','pose_refuse','pose_greet'],
crane:['parts_kit','heads','pose_sit','pose_rise','pose_walk']
};
for(const [who,files] of Object.entries(data)){
  document.write(`<h2>${who}/</h2><div class="grid">`);
  for(const f of files){
    document.write(`<div class="card"><img src="${who}/${f}.png" alt="${f}"><code>${who}/${f}.png</code></div>`);
  }
  document.write('</div>');
}
</script>
